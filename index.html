/* Layout: one narrow stage column. Rival lanes on top, the reveal strip in the middle, your lanes and a sticky
   action bar at the bottom. One deliberate world (a show stage at night), so a single dark palette by choice. */
:root {
  color-scheme: dark;
  --curtain: #1f0810;
  --velvet: #34101a;
  --velvet-hi: #461724;
  --brass: #f2c46a;
  --cream: #fff0db;
  --muted: #c9a7ae;
  --you: #72e3cf;
  --rival: #ff86a8;
  --low: #ff5b4d;
  --line: rgba(255, 240, 219, .14);
  --ghost-ink: rgba(255, 240, 219, .26);
  --shade: rgba(0, 0, 0, .32);
  --spot: rgba(255, 226, 170, .16);
  --pleat: rgba(0, 0, 0, .16);
  --brass-soft: rgba(242, 196, 106, .14);
  --brass-line: rgba(242, 196, 106, .32);
  --you-soft: rgba(114, 227, 207, .2);
  --low-soft: rgba(255, 91, 77, .2);
  --panel: #14040a;
  --frame-hi: #7a5219;
  --frame-lo: #2b1907;
  --bulb: #fff3cc;
  --bulb-halo: rgba(255, 208, 110, .5);
  --beam: rgba(255, 236, 190, .2);
  --stage-glow: rgba(242, 196, 106, .22);
  --plank: rgba(0, 0, 0, .3);
  --floor-hi: #3d1a14;
  --floor-lo: #12040a;
  /* display + digit faces are subset WOFF2 embedded by build.py (ZCOOL QingKe HuangYou, Big Shoulders Display; OFL) */
  --display: "TO Display", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  --digits: "TO Digits", Impact, "Arial Narrow", sans-serif;
  --body: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", system-ui, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { height: 100%; background: var(--curtain); }
body {
  min-height: 100%; margin: 0; color: var(--cream); font-family: var(--body); font-size: 15px; line-height: 1.55;
  background:
    radial-gradient(ellipse 80% 36% at 50% 0%, var(--spot), transparent 72%),
    repeating-linear-gradient(90deg, var(--pleat) 0 18px, transparent 18px 36px),
    var(--curtain);
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
.wrap { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 8px 0; display: flex; flex-direction: column; gap: 14px; }

/* header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-block: 8px 0; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; flex-wrap: wrap; }
.logo { font-family: var(--display); font-size: 1.45rem; color: var(--brass); letter-spacing: .04em; }
.tag { font-size: .72rem; color: var(--muted); letter-spacing: .1em; }
.top-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; margin-left: auto; }
.ghost { background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: .82rem; cursor: pointer; }
.ghost:hover { border-color: var(--brass-line); }

.lang-toggle { display: flex; align-items: center; gap: 1px; border: 1px solid var(--line); border-radius: 999px; padding: 2px; font-size: .74rem; }
.lang-toggle button { border: 0; background: transparent; color: var(--muted); padding: 2px 5px; border-radius: 999px; cursor: pointer; }
.lang-toggle button[aria-pressed="true"] { background: var(--brass); color: var(--curtain); }
.lang-toggle > span { color: var(--muted); }

/* cover: a theatre marquee sign, then a stage that loops one round of the game */
#menu { display: grid; gap: 16px; padding-bottom: 28px; }
.marquee { position: relative; padding: 15px; border-radius: 20px; isolation: isolate;
  background: linear-gradient(160deg, var(--frame-hi), var(--frame-lo) 70%);
  box-shadow: 0 0 0 1px var(--brass-line), 0 22px 60px var(--shade), 0 0 70px var(--brass-soft); }
.marquee::before, .marquee::after { content: ""; position: absolute; inset: 0; border-radius: inherit; z-index: 0;
  background-size: 30px 30px; background-repeat: round; animation: bulbs 1.3s steps(1) infinite; }
.marquee::before { background-image:
  radial-gradient(circle at 25% 25%, var(--bulb) 0 2.6px, var(--bulb-halo) 3.4px, transparent 6px),
  radial-gradient(circle at 75% 75%, var(--bulb) 0 2.6px, var(--bulb-halo) 3.4px, transparent 6px); }
.marquee::after { background-image:
  radial-gradient(circle at 75% 25%, var(--bulb) 0 2.6px, var(--bulb-halo) 3.4px, transparent 6px),
  radial-gradient(circle at 25% 75%, var(--bulb) 0 2.6px, var(--bulb-halo) 3.4px, transparent 6px);
  animation-delay: -.65s; }
@keyframes bulbs { 0% { opacity: 1; } 50% { opacity: .22; } }
.marquee-inner { position: relative; z-index: 1; border-radius: 8px; padding: 16px 14px 14px; text-align: center;
  background: radial-gradient(ellipse 90% 70% at 50% 0%, var(--brass-soft), transparent 70%), var(--panel);
  box-shadow: inset 0 0 0 1px var(--brass-line), inset 0 0 40px var(--shade); }
.hero { font-family: var(--display); font-weight: 400; font-size: clamp(3rem, 15vw, 5.2rem); line-height: .95; margin: 0; letter-spacing: .04em;
  text-shadow: 0 0 2px var(--cream), 0 0 28px rgba(242, 196, 106, .45); }
.hero em { font-style: normal; color: var(--brass); }
.hook { margin: 10px 0 0; color: var(--muted); font-size: .92rem; text-wrap: balance; }

.stage { position: relative; height: 196px; border-radius: 16px; overflow: hidden; border: 1px solid var(--line);
  background: radial-gradient(ellipse 75% 50% at 50% 100%, var(--stage-glow), transparent 72%), linear-gradient(180deg, var(--panel), var(--curtain)); }
.valance { position: absolute; inset: 0 0 auto; height: 28px; z-index: 3;
  background: radial-gradient(circle at 50% 0, var(--velvet-hi) 0 68%, transparent 70%) 0 0 / 30px 28px repeat-x;
  filter: drop-shadow(0 5px 6px var(--shade)); }
.beam { position: absolute; top: -10px; width: 46%; height: 260px; z-index: 1; transform-origin: 50% 0;
  background: linear-gradient(180deg, var(--beam), transparent 90%); clip-path: polygon(46% 0, 54% 0, 100% 100%, 0 100%); }
.beam-l { left: 2%; animation: sway 7s ease-in-out infinite alternate; }
.beam-r { right: 2%; animation: sway 7s ease-in-out -3.5s infinite alternate-reverse; }
@keyframes sway { from { transform: rotate(-22deg); } to { transform: rotate(16deg); } }
.floor { position: absolute; left: 0; right: 0; bottom: 0; height: 30px; z-index: 1;
  background: repeating-linear-gradient(90deg, var(--plank) 0 1px, transparent 1px 38px), linear-gradient(180deg, var(--floor-hi), var(--floor-lo)); }
.cast { position: absolute; left: 0; right: 0; bottom: 10px; z-index: 2; display: flex; align-items: flex-end; justify-content: center; gap: 6px; }
.crew { display: flex; gap: 3px; }
.star { position: relative; display: grid; justify-items: center; gap: 7px; }
.crew.rival .star { --ring: var(--rival); }
.crew.you .star { --ring: var(--you); }
.card { width: 36px; height: 42px; border-radius: 6px; display: grid; place-items: center; perspective: 200px;
  background: var(--panel); border: 1px solid var(--brass-line); box-shadow: 0 6px 14px var(--shade);
  font-family: var(--digits); font-weight: 900; font-size: 1.7rem; line-height: 1; color: var(--brass); font-variant-numeric: tabular-nums; }
.card .q { color: var(--muted); font-size: 1.2rem; }
.card.flip span { display: inline-block; animation: flip .4s cubic-bezier(.2, .8, .2, 1) both; animation-delay: var(--d, 0ms); }
.ava { width: 46px; height: 46px; border-radius: 50%; overflow: hidden; padding: 0; border: 0;
  background: var(--shade); box-shadow: 0 0 0 2px var(--ring), 0 10px 20px var(--shade); transition: box-shadow .12s, opacity .4s, transform .15s; }
.star { width: 48px; }
.star-nm { font-size: 9.5px; line-height: 1.1; color: var(--cream); white-space: nowrap; text-align: center; margin-top: -2px; letter-spacing: -.01em; }
.star.out .star-nm { opacity: .35; }
button.ava { cursor: pointer; }
button.ava:hover { transform: translateY(-2px); box-shadow: 0 0 0 3px var(--you), 0 10px 20px var(--shade); }
.lineup-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: -8px; font-size: .8rem; color: var(--muted); flex-wrap: wrap; }
.star.low .card { color: var(--low); border-color: var(--low); box-shadow: 0 0 16px var(--low-soft); }
.star.cursor .ava { box-shadow: 0 0 0 3px var(--brass), 0 0 22px var(--brass); }
.star.out .ava, .star.out .card { opacity: .3; }
.star.out::after { content: attr(data-out); position: absolute; left: 50%; top: 58%; transform: translate(-50%, -50%) rotate(-7deg);
  font-family: var(--display); font-size: 1rem; line-height: 1.3; color: var(--low); border: 2px solid var(--low); border-radius: 4px;
  padding: 0 5px; background: var(--curtain); white-space: nowrap; animation: stamp .35s cubic-bezier(.3, 1.6, .5, 1) both; }

  function grade(an) {

  async function startRound() {

    const an = { regret: full.regret, theoryLoss: full.theoryLoss, skill: full.skill, mind: full.mind, luck: full.luck,

  function laurel() {

    if (window.FX) { await FX.curtain("close"); if (S !== game) return FX.curtain("open"); }
    showMvp();
    Sound.stop(); Sound.sfx(S.won ? "fanfare" : "sad-trombone");
    if (window.FX) { await FX.curtain("open"); FX.confetti(); const p = document.querySelector(".mvp-portrait"); if (p) FX.spotlight(p); }
    const m = awards().mvp;
    setTimeout(() => { if (S === game && document.getElementById("mvp")) { Sound.play(perfectUrl(m.ref, pieceOf(m).id), { maxSec: 12 }); setTimeout(() => Sound.sfx("ovation", 0.5), 6500); } }, 2300);
  }
  async function makeShareCard() {
    if (!window.FX || !FX.shareCard) return toast("share.unavailable");
    const { mvp: m, flop: f } = awards(), L = LEVELS[S.level];
    const result = t(S.won ? "share.win" : "share.lose");
    try {
      const blob = await FX.shareCard({ lang, title: t("title"), subtitle: t(S.won ? "mvp.titleWin" : "mvp.titleLose"),
        mvp: { img: portrait(m.ref, true), name: lname(m.ref), line: `${pieceOf(m).title[lang]} · ${t("lvl.5")}` },
        flop: f ? { img: portrait(f.s.ref, true), name: lname(f.s.ref), line: `${t("act.single", { card: f.e.low })} · ${flopText(f)}`, label: t("mvp.flopAward") } : null,
        stats: [S.daily ? t("share.daily", { n: dailyNo(S.daily), result }) : t("share.vs", { tier: t(L.tierKey), name: t(L.nameKey), result }), t("share.acc", { acc: accuracy() + "%" })],
        footer: "zhangzeyu97.github.io/tonight-out", date: today() });
      if (!blob) return toast("share.unavailable");
      showShare(blob);
    } catch (e) { toast("share.unavailable"); }
  }
  function showShare(blob) {
    const url = URL.createObjectURL(blob), el = document.createElement("div");
    el.className = "rp-back share-back";
    el.innerHTML = `<div class="rp share" role="dialog" aria-modal="true" aria-labelledby="share-title">
      <div class="rp-head"><h2 id="share-title">${t("share.title")}</h2><button type="button" class="ghost" data-share="close">${t("roster.close")}</button></div>
      <img src="${url}" alt="${attr(t("share.title"))}">
      <p class="share-hint">${t("share.hint")}</p>
      <div class="btnrow"><a class="primary as-btn" href="${url}" download="tonight-out-${today()}.png">${t("share.save")}</a>
        ${navigator.canShare && navigator.canShare({ files: [new File([blob], "x.png", { type: "image/png" })] }) ? `<button type="button" class="ghost" data-share="native">${t("share.share")}</button>` : ""}</div>
    </div>`;
    el.addEventListener("click", async (e) => {
      const b = e.target.closest("[data-share]");
      if (e.target === el || (b && b.dataset.share === "close")) { el.remove(); URL.revokeObjectURL(url); return; }
      if (b && b.dataset.share === "native") { try { await navigator.share({ files: [new File([blob], `tonight-out-${today()}.png`, { type: "image/png" })], title: t("title") }); } catch (err) { /* cancelled */ } }
    });
    document.body.appendChild(el);
  }

  function nextRound() { if (S && S.phase === "result") { Sound.stop(); S.flopToken = null; S.round++; startRound(); } }

  // ---------- rendering ----------
  function lane(s, side) {
    const pick = side === "you" ? S.pick[s.id] : null;
    const canPick = side === "you" && s.alive && S.phase === "pick";
    const name = singerName(s);
    const chips = [1, 2, 3, 4, 5].map((c) => {
      const used = !has(s, c), now = s.shown === c;
      const cls = "chip" + (now ? " now" : used ? " used" : "") + (pick === c && S.phase === "pick" ? " sel" : "");
      if (side === "you") {
        return `<button type="button" class="${cls}" data-id="${s.id}" data-c="${c}" aria-pressed="${pick === c}" aria-label="${attr(t("aria.sing", { name, card: c }))}"${!canPick || used ? " disabled" : ""}>${c}</button>`;
      }
      return `<span class="${cls}" aria-label="${attr(t("aria.card", { name, card: c, used: used && !now ? t("aria.used") : "" }))}">${c}</span>`;
    }).join("");
    let score = "";
    if (s.shown != null) score = `<span>${s.shown}</span><small class="lv">${t("lvl." + s.shown)}</small>`;
    else if (S.phase === "pick" && s.alive) score = side === "rival" ? `<span class="q">?</span>` : (pick ? `<span class="pend">${pick}</span>` : `<span class="q">·</span>`);
    const classes = ["lane", side];
    if (!s.alive) classes.push("out");
    if (S.outId === s.id) classes.push("justout");
    if (S.lowIds.includes(s.id)) classes.push("low");
    if (S.cursorId === s.id) classes.push("cursor");
    const idx = (side === "rival" ? 0 : 3) + (side === "rival" ? S.ai : S.you).indexOf(s);
    return `<div class="${classes.join(" ")}" id="lane-${s.id}" data-out="${attr(t("stamp.out"))}">
      <div class="who">${avatar(s.ref, 52)}<span class="nm">${name}</span></div>
      <div class="chips">${chips}</div>
      <div class="score${S.flip && s.shown != null ? " flip" : ""}" style="--d:${idx * 110}ms">${score}</div>
    </div>`;
  }

  function paintLanes() {
    $("#rival-lanes").innerHTML = S.ai.map((s) => lane(s, "rival")).join("");
    $("#you-lanes").innerHTML = S.you.map((s) => lane(s, "you")).join("");
  }
  function renderBanner() {
    const r = S.result;
    let html = t(S.round === 0 ? "banner.first" : "banner.next");
    if (r && r.kind === "reveal") html = t("banner.reveal");
    else if (r && r.kind === "tie") html = t("banner.tie", { n: r.tiedN, low: r.low });
    else if (r && r.kind === "done") {
      const o = singer(r.outId), fl = r.flop || {}, gag = fl.kind === "fail" ? gagOf(o.ref, pieceOf(o).id, fl.f) : "";
      const why = fl.kind === "unlucky" ? t("banner.unlucky", { name: who(o), low: r.low })
        : gag ? t("banner.flop", { name: who(o), piece: pieceOf(o).title[lang], gag })
        : t(r.tiedN > 1 ? "banner.draw" : "banner.low", { name: who(o), piece: pieceOf(o).title[lang], low: r.low, lvl: t("lvl." + r.low) });
      html = `<span class="${r.mine ? "bad" : "good"}"><strong>${t("banner.out", { why })}</strong></span>`;
    }
    $("#banner").innerHTML = html;
  }
  function renderInsight() {
    const r = S.result;
    if (!r || r.kind !== "done") return "";
    const an = r.an;
    const ideal = r.ideal.map((d) => t("insight.move", { move: actLabel(d.cards), p: pct(d.p) })).join(t("insight.separator"));
    const comps = [`${t("comp.skill")} ${pts(an.skill)}`];
    if (Math.abs(an.mind) >= 0.0005) comps.push(`${t("comp.mind")} ${pts(an.mind)}`);
    if (Math.abs(an.luck) >= 0.0005) comps.push(`${t("comp.luck")} ${pts(an.luck)}`);
    const theory = t(an.theoryLoss < 0.0005 ? "insight.noLoss" : "insight.loss", { loss: (an.theoryLoss * 100).toFixed(1) });
    let readTxt = "", readMore = "";
    const read = r.read;
    if (read && read.guess) {
      readTxt = `<span>${t("reader.insight", { low: read.guess[0], p: pct(read.guess[1]),
        hit: t(read.hit ? "reader.hit" : "reader.miss"), mode: read.mode === "exploit" ? t("reader.target") : "" })}</span>`;
      readMore = `<p>${t("reader.more", { mode: t(read.mode === "exploit" ? "reader.exploit" : "reader.nash"), conf: pct(read.conf || 0) })}</p>`;
    }
    return `<div class="row"><span class="grade ${GRADE_CLASSES[r.gradeKey]}">${t(r.gradeKey)}</span><span class="comps">${comps.join(t("insight.separator"))}</span>${readTxt}</div>
      <details><summary>${t("insight.summary")}</summary><div class="more">
        ${an.regret > 0.0005 ? `<p>${t("insight.best", { move: `<strong>${actLabel(an.best)}</strong>`, p: pct(an.bestP) })}</p>` : ""}
        <p>${t("insight.theory", { text: theory })}</p>
        <p>${t("insight.ideal", { moves: `<span class="mono">${ideal}</span>` })}</p>
        ${readMore}
        <p>${t("insight.comps")}</p>
        <p>${t("insight.grades")}</p>
        <p>${t("insight.commit", { text: `<code>${r.commit.text}</code>`, hash: `<code>${r.commit.hash || t("insight.noHash")}</code>` })}</p>
      </div></details>`;
  }
  function renderLock() {
    const L = LEVELS[S.level];
    $("#rival-name").textContent = t("rival.label", { tier: t(L.tierKey), name: t(L.nameKey) });
    $("#lock").textContent = S.phase === "pick" ? (S.commit && S.commit.hash ? t("lock.hash", { hash: S.commit.hash }) : t("lock.ready")) : "";
  }

  function render() {
    paintLanes(); renderBanner(); renderLock();
    $("#round-no").innerHTML = `${t("round.label", { round: S.round + 1 })}<small>${t("round.max")}</small>`;
    const v = S.winHist[S.winHist.length - 1];
    $("#meter-fill").style.width = (v * 100).toFixed(1) + "%";
    $("#meter-num").textContent = pct(v);
    $("#insight").innerHTML = renderInsight();

    const youAlive = alive(S.you);
    const quick = $("#quick");
    quick.hidden = S.phase !== "pick";
    quick.innerHTML = `<span>${t("button.all")}</span>` + [1, 2, 3, 4, 5].map((c) =>
      `<button type="button" data-all="${c}" aria-label="${attr(t("aria.all", { card: c }))}"${S.phase === "pick" && youAlive.every((s) => has(s, c)) ? "" : " disabled"}>${c}</button>`).join("");
    const btn = $("#btn-sing");
    btn.classList.toggle("revealing", S.phase === "reveal");
    $("#actionbar").hidden = S.phase === "over";
    if (S.phase === "pick") { btn.textContent = t("button.sing"); btn.disabled = !youAlive.every((s) => S.pick[s.id]); }
    else if (S.phase === "result") { btn.textContent = t("button.next"); btn.disabled = false; }
    else { btn.textContent = t("button.revealing"); btn.disabled = true; }

    renderOver();
    if (S.phase !== "reveal") stable = JSON.parse(JSON.stringify(S));
  }

  function spark(hist) {
    const W = 320, H = 104, x0 = 36, x1 = W - 12, y = (v) => 10 + (1 - v) * 72;
    const n = hist.length, x = (i) => x0 + (n === 1 ? 0 : (i * (x1 - x0)) / (n - 1));
    const pts = hist.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
    const dots = hist.map((v, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="${i === n - 1 ? 4.5 : 3}" fill="var(--you)"/>`).join("");
    const xl = hist.map((_, i) => `<text x="${x(i).toFixed(1)}" y="${H - 4}" text-anchor="middle">${i === 0 ? t("spark.start") : t("spark.round", { round: i })}</text>`).join("");
    return `<svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="${attr(t("spark.aria"))}">
      <line x1="${x0}" x2="${x1}" y1="${y(0.5)}" y2="${y(0.5)}" stroke="var(--line)" stroke-dasharray="4 4"/>
      <line x1="${x0}" x2="${x1}" y1="${y(1)}" y2="${y(1)}" stroke="var(--line)"/>
      <line x1="${x0}" x2="${x1}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)"/>
      <text x="${x0 - 6}" y="${y(1) + 3}" text-anchor="end">100%</text>
      <text x="${x0 - 6}" y="${y(0.5) + 3}" text-anchor="end">50%</text>
      <text x="${x0 - 6}" y="${y(0) + 3}" text-anchor="end">0%</text>
      <polyline points="${pts}" fill="none" stroke="var(--you)" stroke-width="2.5" stroke-linejoin="round"/>
      ${dots}${xl}</svg>`;
  }

  function rankName(cls, hand) {
    const r = parseInt(cls, 10);
    if (hand === 1) return t("cls.last");
    if (r === (hand || 5) - 1) return t("cls.lowest");
    return t(["cls.highest", "cls.second", "cls.third", "cls.fourth"][r]);
  }
  function habitText(h) {
    const d = parseInt(h.cls, 10), round = h.ctx[0] === "r" ? +h.ctx.slice(1) : null;
    const text = {
      top_r: () => t("habit.top_r", { round: round + 1, name: rankName(h.cls, 5 - round) }),
      top_g: () => t("habit.top_g", { name: rankName(h.cls, 0) }),
      abs_g: () => t("habit.abs_g", { low: d }),
      vsAI_o: () => t("habit.vsAI_o", { after: t("after." + h.ctx), rel: t("rel.ai." + d) }),
      vsSelf_o: () => t("habit.vsSelf_o", { after: t("after." + h.ctx), rel: t("rel.self." + d) }),
      top_lead: () => t("habit.top_lead", { lead: t("lead." + h.ctx), name: rankName(h.cls, 0) }),
    }[h.expert]();
    return text + (h.cls.endsWith("s") ? t("habit.split") : "") + t("habit.share", { p: pct(h.share) });
  }
  function habits() {
    if (S.level !== "reader" || !ai || !ai.habits) return "";
    const seen = new Set();   // one line per distinct habit: "always the top song" shows once, not per context
    const lines = ai.habits(8).filter((h) => h.ctx !== "-" && !seen.has(h.view + h.cls) && seen.add(h.view + h.cls))
      .slice(0, 3).map((h) => `<li>${habitText(h)}</li>`);
    return lines.length ? `<p>${t("reader.habits")}</p><ul class="habits">${lines.join("")}</ul>
      <div class="btnrow"><button type="button" class="ghost" id="btn-forget">${t("reader.forget")}</button></div>` : "";
  }

  function renderOver() {
    const box = $("#over");
    if (S.phase !== "over") { box.hidden = true; return; }
    const L = LEVELS[S.level], rec = (records()[S.level] || { w: 0, l: 0 });
    const counts = Object.fromEntries(Object.keys(GRADE_CLASSES).map((key) => [key, 0]));
    S.log.forEach((e) => { if (counts[e.gradeKey] != null) counts[e.gradeKey]++; });
    const tally = Object.entries(counts).filter(([, n]) => n).map(([k, n]) => `<span class="grade ${GRADE_CLASSES[k]}">${t(k)} ${n}</span>`).join("");
    box.innerHTML = `
      <h2 class="${S.won ? "win" : "lose"}">${t(S.won ? "over.win" : "over.lose")}</h2>
      <p>${t("over.summary", { tier: t(L.tierKey), name: t(L.nameKey), rounds: S.log.length, record: t("records", rec) })}</p>
      <div class="acc-row"><div class="acc"><b>${accuracy()}%</b><span>${t("over.accuracy")}</span></div><div class="tally">${tally}</div></div>
      ${spark(S.winHist)}
      ${breakdown()}
      ${S.won ? "" : `<p class="tip">${t(L.tipKey)}</p>`}
      ${habits()}
      <div class="btnrow">
        <button type="button" class="primary" id="btn-again">${t("button.again")}</button>
        <button type="button" class="ghost" id="btn-share-card">${t("mvp.share")}</button>
        ${S.daily ? `<button type="button" class="ghost" id="btn-daily-copy">${t("daily.copy")}</button>` : ""}
        <button type="button" class="ghost" id="btn-encore">♪ ${t("over.encore")}</button>
        <button type="button" class="ghost" id="btn-copy">${t("button.copy")}</button>
        <button type="button" class="ghost" id="btn-levels">${t("menu.change")}</button>
      </div>
      <textarea id="report-text" readonly hidden aria-label="${attr(t("aria.report"))}"></textarea>`;
    box.hidden = false;
  }

  const sum = (k) => S.log.reduce((a, e) => a + (e[k] || 0), 0);
  function accuracy() {
    const sc = S.log.map((e) => GRADE_SCORE[e.gradeKey]).filter((x) => x != null);
    return sc.length ? Math.round(sc.reduce((a, b) => a + b, 0) / sc.length) : 0;
  }
  function breakdown() {
    if (!S.log.length || S.log[0].skill == null) return "";
    const parts = [["skill", sum("skill")], ["mind", sum("mind")], ["luck", sum("luck")]];
    const scale = Math.max(0.25, ...parts.map(([, x]) => Math.abs(x)));
    const rows = parts.map(([k, x]) => {
      const w = (Math.abs(x) / scale) * 50;
      return `<div class="bd-row"><span>${t("comp." + k)}</span><div class="bd-track"><i class="${x >= 0 ? "up" : "down"}" style="width:${w.toFixed(1)}%"></i></div><b>${pts(x)}</b></div>`;
    }).join("");
    // turning point: the round with the biggest swing, explained by its biggest part
    let key = null;
    for (const e of S.log) {
      const sw = Math.abs(e.skill + e.mind + e.luck);
      if (!key || sw > key.sw) key = { e, sw };
    }
    let keyTxt = "";
    if (key && key.sw >= 0.05) {
      const [k, x] = [["skill", key.e.skill], ["mind", key.e.mind], ["luck", key.e.luck]].sort((a, b) => Math.abs(b[1]) - Math.abs(a[1]))[0];
      keyTxt = `<p class="keyround">${t("over.key", { round: key.e.round + 1, cause: t(`cause.${k}.${x >= 0 ? "up" : "down"}`, { pts: pts(x) }) })}</p>`;
    }
    return `<div class="bd"><p class="bd-title">${t("over.breakdown")}</p>${rows}</div>${keyTxt}`;
  }
  function reportCards(cards) {
    return cards.every((c) => c === cards[0]) ? String(cards[0]) : actCards(cards);
  }
  function report() {
    const L = LEVELS[S.level];
    const lines = [t("report.heading", { tier: t(L.tierKey), name: t(L.nameKey), outcome: t(S.won ? "report.win" : "report.lose") })];
    S.log.forEach((e) => lines.push(t("report.round", { round: e.round + 1, you: reportCards(e.you), ai: reportCards(e.ai), grade: t(e.gradeKey), out: who(singer(e.outId)) })));
    if (S.log.length && S.log[0].skill != null)
      lines.push(t("report.stats", { acc: accuracy() + "%", s: pts(sum("skill")), m: pts(sum("mind")), l: pts(sum("luck")) }));
    lines.push(t("report.history", { history: S.winHist.map(pct).join(t("report.arrow")) }));
    return lines.join("\n");
  }

  function toast(key, params) {
    const el = $("#toast"); toast.key = key; el.textContent = t(key, params); el.hidden = false;
    clearTimeout(toast.h); toast.h = setTimeout(() => { el.hidden = true; }, 1800);
  }

  // ---------- events ----------
  document.addEventListener("click", (ev) => {
    Sound.unlock();                                     // the first tap unlocks audio for later reveals
    const el = ev.target.closest("button"); if (!el || el.closest(".rp-back")) return;
    if (el.dataset.mvp) {
      const act = el.dataset.mvp;
      if (act === "share") return makeShareCard();
      if (act === "flop") { const f = awards().flop; return f && Sound.play(flopClip(f), { maxSec: 9 }); }
      if (act === "review") { closeMvp(); Sound.stop(); return $("#over").scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "start" }); }
      if (act === "again") return S.daily ? newGame(S.level, S.daily) : newGame(S.level);
    }
    if (el.id === "daily") return newGame("textbook", today());
    if (el.dataset.locked != null) return toast("hall.locked");
    if (el.id === "btn-daily-copy") {
      const txt = dailyText(S && S.daily ? S.daily : today());
      try { navigator.clipboard.writeText(txt).then(() => toast("toast.copied"), () => toast("toast.manual")); } catch (e) { toast("toast.manual"); }
      return;
    }
    if (el.id === "btn-share-card") return makeShareCard();
    if (el.dataset.lang) return setLanguage(el.dataset.lang);
    if (el.classList.contains("level")) return newGame(el.dataset.level);
    if (el.id === "btn-sound") return Sound.toggle();
    if (el.id === "btn-shuffle") return setLineup(pickLineup(3));
    if (el.dataset.slot != null) return openRoster(+el.dataset.slot);
    if (el.dataset.clip) {
      document.querySelectorAll(".hall-lv button.playing").forEach((x) => x.classList.remove("playing"));
      if (!Sound.on) Sound.toggle();
      el.classList.add("playing");
      return Sound.play(el.dataset.clip, { maxSec: 14, onEnd: () => el.classList.remove("playing") });
    }
    if (el.id === "btn-rules") { const p = $("#rules-panel"); p.hidden = !p.hidden; el.setAttribute("aria-expanded", String(!p.hidden)); return; }
    if (el.id === "btn-menu" || el.id === "btn-levels") return showMenu();
    if (!S) return;
    if (el.dataset.c && S.phase === "pick") { S.pick[el.dataset.id] = +el.dataset.c; return render(); }
    if (el.dataset.all && S.phase === "pick") { for (const s of alive(S.you)) S.pick[s.id] = +el.dataset.all; return render(); }
    if (el.id === "btn-sing") return S.phase === "pick" ? sing() : nextRound();
    if (el.id === "btn-again") return S.daily ? newGame(S.level, S.daily) : newGame(S.level);
    if (el.id === "btn-encore") {
      const w = alive(S.won ? S.you : S.ai)[0];
      return w && Sound.play(perfectUrl(w.ref, pieceOf(w).id), { maxSec: 14 });
    }
    if (el.id === "btn-forget") { store.del(KEY_READER); ai = new MindReader2(null); toast("reader.forgot"); return renderOver(); }
    if (el.id === "btn-copy") {
      const txt = report();
      const fallback = () => { const ta = $("#report-text"); ta.hidden = false; ta.value = txt; ta.focus(); ta.select(); toast("toast.manual"); };
      try { navigator.clipboard.writeText(txt).then(() => toast("toast.copied"), fallback); } catch (e) { fallback(); }
    }
  });
  document.addEventListener("keydown", (ev) => {
    if (ev.key === "Escape" && document.getElementById("mvp")) { closeMvp(); return; }
    if (!S || ev.metaKey || ev.ctrlKey || ev.altKey) return;
    if (/^[1-5]$/.test(ev.key) && S.phase === "pick") {
      const c = +ev.key; if (alive(S.you).every((s) => has(s, c))) { for (const s of alive(S.you)) S.pick[s.id] = c; render(); }
    } else if (ev.key === "Enter" && (S.phase === "pick" || S.phase === "result") && document.activeElement.tagName !== "BUTTON") {
      S.phase === "pick" ? sing() : nextRound();
    }
  });

  // ---------- boot (keeps a game in progress across page updates) ----------
  const hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) hot.snapshot(() => ({ S: stable }));
  const boot = (data) => {
    if (data && data.S && data.S.result && data.S.you && byId[data.S.you[0].ref] && LEVELS[data.S.level] && data.S.phase !== "reveal") {
      S = data.S; S.cursorId = null; ai = LEVELS[S.level].make();
      showScreen(false);
      render();
    } else showMenu();
  };
  if (hot && hot.ready) hot.ready(boot); else boot((hot && hot.data) || {});
})();
</script>

</body>
</html>
