/* Layout: one narrow stage column. Rival lanes on top, the reveal strip in the middle, your lanes and a sticky
   action bar at the bottom. One deliberate world (a show stage at night), so a single dark palette by choice. */
:root {
  color-scheme: dark;
  --curtain: #1f0810;
  --velvet: #34101a;
  --velvet-hi: #461724;
  --brass: #f2c46a;
  --cream: #fff0db;
  --muted: #c9a7ae;
  --you: #72e3cf;
  --rival: #ff86a8;
  --low: #ff5b4d;
  --line: rgba(255, 240, 219, .14);
  --ghost-ink: rgba(255, 240, 219, .26);
  --shade: rgba(0, 0, 0, .32);
  --spot: rgba(255, 226, 170, .16);
  --pleat: rgba(0, 0, 0, .16);
  --brass-soft: rgba(242, 196, 106, .14);
  --brass-line: rgba(242, 196, 106, .32);
  --you-soft: rgba(114, 227, 207, .2);
  --low-soft: rgba(255, 91, 77, .2);
  --panel: #14040a;
  --frame-hi: #7a5219;
  --frame-lo: #2b1907;
  --bulb: #fff3cc;
  --bulb-halo: rgba(255, 208, 110, .5);
  --beam: rgba(255, 236, 190, .2);
  --stage-glow: rgba(242, 196, 106, .22);
  --plank: rgba(0, 0, 0, .3);
  --floor-hi: #3d1a14;
  --floor-lo: #12040a;
  /* display + digit faces are subset WOFF2 embedded by build.py (ZCOOL QingKe HuangYou, Big Shoulders Display; OFL) */
  --display: "TO Display", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  --digits: "TO Digits", Impact, "Arial Narrow", sans-serif;
  --body: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", system-ui, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { height: 100%; background: var(--curtain); }
body {
  min-height: 100%; margin: 0; color: var(--cream); font-family: var(--body); font-size: 15px; line-height: 1.55;
  background:
    radial-gradient(ellipse 80% 36% at 50% 0%, var(--spot), transparent 72%),
    repeating-linear-gradient(90deg, var(--pleat) 0 18px, transparent 18px 36px),
    var(--curtain);
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
.wrap { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 8px 0; display: flex; flex-direction: column; gap: 14px; }

/* header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-block: 8px 0; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; flex-wrap: wrap; }
/* the cover marquee already shows the title: keep the h1 for screen readers only */
.brand { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.top { justify-content: flex-end; }
.top:has(#btn-menu:not([hidden])) { justify-content: space-between; }
.logo { font-family: var(--display); font-size: 1.45rem; color: var(--brass); letter-spacing: .04em; }
.tag { font-size: .72rem; color: var(--muted); letter-spacing: .1em; }
.top-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; margin-left: auto; }
.ghost { background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: .82rem; cursor: pointer; }
.ghost:hover { border-color: var(--brass-line); }

.lang-toggle { display: flex; align-items: center; gap: 1px; border: 1px solid var(--line); border-radius: 999px; padding: 2px; font-size: .74rem; }
.lang-toggle button { border: 0; background: transparent; color: var(--muted); padding: 2px 5px; border-radius: 999px; cursor: pointer; }
.lang-toggle button[aria-pressed="true"] { background: var(--brass); color: var(--curtain); }
.lang-toggle > span { color: var(--muted); }

/* Cover: live muted theater plus the selectable cast. */
#menu { display: grid; gap: 16px; padding-bottom: 28px; }
.marquee { position: relative; padding: 15px; border-radius: 20px; isolation: isolate;
  background: linear-gradient(160deg, var(--frame-hi), var(--frame-lo) 70%);
  box-shadow: 0 0 0 1px var(--brass-line), 0 22px 60px var(--shade), 0 0 70px var(--brass-soft); }
.marquee::before, .marquee::after { content: ""; position: absolute; inset: 0; border-radius: inherit; z-index: 0;
  background-size: 30px 30px; background-repeat: round; animation: bulbs 1.3s steps(1) infinite; }
.marquee::before { background-image:
  radial-gradient(circle at 25% 25%, var(--bulb) 0 2.6px, var(--bulb-halo) 3.4px, transparent 6px),
  radial-gradient(circle at 75% 75%, var(--bulb) 0 2.6px, var(--bulb-halo) 3.4px, transparent 6px); }
.marquee::after { background-image:
  radial-gradient(circle at 75% 25%, var(--bulb) 0 2.6px, var(--bulb-halo) 3.4px, transparent 6px),
  radial-gradient(circle at 25% 75%, var(--bulb) 0 2.6px, var(--bulb-halo) 3.4px, transparent 6px);

.rules-c { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; counter-reset: rule; }

/* board */
#game { display: grid; gap: 12px; }
.team { display: grid; gap: 6px; }

.lanes { display: grid; gap: 6px; }
.lane { position: relative; display: grid; grid-template-columns: 66px minmax(0, 1fr) 54px; align-items: center; gap: 10px; padding: 6px 10px; background: var(--velvet); border-radius: 12px; border: 1px solid var(--line); transition: box-shadow .12s, opacity .4s; }
.lane.you { --ring: var(--you); }
.lane.rival { --ring: var(--rival); }
.who { display: flex; flex-direction: column; align-items: center; line-height: 1.15; min-width: 0; }
.mask { width: 52px; height: 52px; display: block; border-radius: 50%; overflow: hidden; background: var(--shade);
  box-shadow: 0 0 0 2px var(--frame-hi), 0 0 0 4px var(--ring); }
.mask img, .ava img { width: 100%; height: 100%; display: block; object-fit: cover; }
.nm { font-weight: 700; color: var(--cream); font-size: .76rem; margin-top: 6px; }
.score small.lv { display: block; font-family: var(--body); font-weight: 500; font-size: .6rem; line-height: 1.2; color: var(--muted); margin-top: 3px; white-space: nowrap; }

.icon-btn { display: grid; place-items: center; width: 32px; height: 28px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--cream); cursor: pointer; padding: 0; }

.hall-hint { margin: -6px 0 0; font-size: .82rem; color: var(--muted); }
.hall { display: grid; gap: 6px; }
.hall-row { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 6px 10px; border-radius: 12px; background: var(--velvet); border: 1px solid var(--line); }

.rp { width: min(520px, 100%); max-height: calc(100% - 32px); overflow: auto; border-radius: 16px; background: var(--velvet); border: 1px solid var(--brass-line); padding: 14px; box-shadow: 0 24px 60px var(--shade); }
.rp-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }

.rp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }

.daily { display: grid; grid-template-columns: auto 1fr; grid-template-areas: "tag cast" "status status"; align-items: center; gap: 6px 12px; text-align: left;
  padding: 12px 14px; border-radius: 14px; cursor: pointer; border: 1px solid var(--brass-line);
  background: linear-gradient(120deg, var(--brass-soft), transparent 70%), var(--velvet); }
.daily:hover { border-color: var(--brass); }
.daily-tag { grid-area: tag; font-family: var(--display); font-size: 1.25rem; color: var(--brass); white-space: nowrap; }

.mvp-screen { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; overflow: auto; padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px));
  background: radial-gradient(ellipse 70% 55% at 50% 30%, rgba(255, 226, 170, .2), transparent 70%), rgba(18, 3, 8, .985); }

.mvp-badge { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); padding: 1px 12px; border-radius: 99px; background: var(--brass); color: var(--curtain);
  font-family: var(--digits); font-weight: 900; font-size: 1.1rem; letter-spacing: .1em; }
.mvp-name { font-family: var(--display); font-size: 2rem; line-height: 1.1; }

.flop-award { width: 100%; display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; align-items: center; gap: 12px; text-align: left;
  padding: 10px 12px; border-radius: 14px; background: var(--velvet); border: 1px dashed var(--low); }

.fa-txt { display: grid; min-width: 0; }

.mvp-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; width: 100%; }
.mvp-actions .primary { flex: 1 1 100%; font-size: 1.2rem; min-height: 46px; }
.share-back { z-index: 80; }
.share { display: grid; gap: 10px; }
.share img { width: 100%; height: auto; border-radius: 10px; box-shadow: 0 10px 30px var(--shade); }
.share-hint { margin: 0; font-size: .78rem; color: var(--muted); text-align: center; }
a.as-btn { display: grid; place-items: center; text-decoration: none; }
:root[lang="en"] .mvp-title, :root[lang="en"] .mvp-name, :root[lang="en"] .daily-tag, :root[lang="en"] .mvp-kicker { font-weight: 900; text-transform: uppercase; letter-spacing: .03em; }
.nm { font-size: .72rem; color: var(--muted); margin-top: 3px; white-space: nowrap; }
.chips { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 5px; max-width: 230px; }
.chip { aspect-ratio: 1; max-width: 100%; display: grid; place-items: center; border-radius: 9px; border: 1px solid var(--line); background: var(--shade); font-family: var(--digits); font-weight: 700; font-size: 1.3rem; line-height: 1; color: var(--cream); padding: 0; font-variant-numeric: tabular-nums; }

.chip.used { color: var(--ghost-ink); text-decoration: line-through; background: transparent; border-style: dashed; }
.chip.sel { background: var(--you); color: var(--curtain); border-color: var(--you); }
.chip.now { border: 2px solid var(--brass); border-style: solid; color: var(--brass); text-decoration: none; }
.score { font-family: var(--digits); font-weight: 900; font-size: 2.4rem; line-height: 1; text-align: center; font-variant-numeric: tabular-nums; perspective: 300px; }
.score .q { color: var(--muted); font-size: 1.5rem; }
.score .pend { color: var(--you); opacity: .6; }
.lane.low .score { color: var(--low); text-shadow: 0 0 18px rgba(255, 91, 77, .55); }
.lane.cursor { box-shadow: 0 0 0 2px var(--brass), 0 0 26px rgba(242, 196, 106, .35); }
.lane.out .who, .lane.out .chips, .lane.out .score { opacity: .32; }
.lane.out::after { content: attr(data-out); position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(-7deg); font-family: var(--display); font-size: 1.5rem; color: var(--low); border: 2px solid var(--low); padding: 0 10px; border-radius: 6px; letter-spacing: .14em; background: var(--curtain); }
.lane.justout::after { animation: stamp .35s cubic-bezier(.3, 1.6, .5, 1) both; }
@keyframes stamp { from { transform: translate(-50%, -50%) rotate(-7deg) scale(1.8); opacity: 0; } to { transform: translate(-50%, -50%) rotate(-7deg) scale(1); opacity: 1; } }

/* reveal strip */
.strip { display: grid; gap: 8px; padding: 12px 14px; border-radius: 14px; background: var(--brass-soft); border: 1px solid var(--brass-line); }
.strip-top { display: flex; justify-content: space-between; align-items: center; gap: 8px 12px; flex-wrap: wrap; }
.round { font-family: var(--display); font-size: 1.3rem; color: var(--brass); letter-spacing: .04em; }

.meter { display: flex; align-items: center; gap: 8px; font-size: .74rem; color: var(--muted); }
.bar { width: 110px; height: 8px; border-radius: 99px; background: var(--rival); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--you); transition: width .6s; }
.meter b { font-family: var(--digits); font-size: 1.05rem; color: var(--you); font-variant-numeric: tabular-nums; min-width: 3ch; text-align: right; }
.banner { font-size: 1rem; min-height: 1.55em; }
.banner strong { font-weight: 700; }
.banner .good { color: var(--you); }
.banner .bad { color: var(--low); }
.insight { font-size: .84rem; color: var(--muted); display: grid; gap: 5px; }
.insight:empty { display: none; }
.insight .row { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.grade { display: inline-block; padding: 0 8px; border-radius: 99px; font-size: .76rem; font-weight: 700; white-space: nowrap; }
.g-brill { background: linear-gradient(90deg, var(--brass), var(--you)); color: var(--curtain); }
.g-best { background: var(--you); color: var(--curtain); }
.g-good { background: var(--you-soft); color: var(--you); }
.g-inacc { background: var(--brass-soft); color: var(--brass); }
.g-mistake { background: var(--low-soft); color: var(--low); }
.g-blunder { background: var(--low); color: var(--curtain); }
.comps { color: var(--cream); font-variant-numeric: tabular-nums; }
.mono { font-family: var(--digits); font-size: 1rem; color: var(--cream); letter-spacing: .03em; }
details summary { cursor: pointer; color: var(--cream); font-size: .8rem; }
details .more { display: grid; gap: 6px; padding-top: 6px; }
details .more p { margin: 0; }
details code { word-break: break-all; font-size: .78rem; color: var(--cream); }

/* action bar */
.actionbar { position: sticky; bottom: 0; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 12px 0 calc(14px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(180deg, transparent, var(--curtain) 32%); }
.quick { display: flex; align-items: center; gap: 4px; font-size: .78rem; color: var(--muted); }
.quick span { margin-right: 4px; }
.quick button { width: 36px; height: 36px; border-radius: 9px; border: 1px solid var(--line); background: var(--shade); font-family: var(--digits); font-weight: 700; font-size: 1.15rem; cursor: pointer; padding: 0; }
.quick button:hover:not(:disabled) { border-color: var(--you); }
.quick button:disabled { opacity: .3; cursor: default; }
.primary { flex: 1 1 150px; min-height: 48px; border: 0; border-radius: 12px; background: var(--brass); color: var(--curtain); font-family: var(--display); font-size: 1.4rem; letter-spacing: .14em; cursor: pointer; }
.primary:disabled { background: var(--brass-soft); color: var(--muted); cursor: not-allowed; }

/* game over */
.over { display: grid; gap: 12px; padding: 16px; border-radius: 16px; background: var(--velvet); border: 1px solid var(--brass-line); margin-bottom: 28px; }
.over h2 { font-family: var(--display); font-weight: 400; font-size: 2.3rem; line-height: 1.2; margin: 0; }
.over h2.win { color: var(--brass); }
.over h2.lose { color: var(--rival); }
.over p { margin: 0; }
.tally { display: flex; gap: 6px; flex-wrap: wrap; }
.acc-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.acc { display: grid; justify-items: start; line-height: 1.15; }
.acc b { font-family: var(--digits); font-weight: 900; font-size: 2.6rem; color: var(--brass); font-variant-numeric: tabular-nums; }
.acc span { font-size: .74rem; color: var(--muted); margin-top: 2px; }
.bd { display: grid; gap: 6px; }
.bd-title { font-size: .78rem; color: var(--muted); }
.bd-row { display: grid; grid-template-columns: 5.5em minmax(0, 1fr) 3.2em; align-items: center; gap: 8px; font-size: .85rem; }
.bd-row b { font-variant-numeric: tabular-nums; text-align: right; font-weight: 700; }
.bd-track { position: relative; height: 10px; border-radius: 99px; background: var(--shade); }
.bd-track::before { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--line); }
.bd-track i { position: absolute; top: 0; bottom: 0; border-radius: 99px; }
.bd-track i.up { left: 50%; background: var(--you); }
.bd-track i.down { right: 50%; background: var(--rival); }
.keyround { color: var(--cream); }
.spark { width: 100%; height: auto; display: block; }
.spark text { fill: var(--muted); font-family: var(--body); font-size: 10px; }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; }

<script>/* Match scoring and review arithmetic are independent of the renderer and AI. */
(function(root){
'use strict';
const grades=['grade.brilliant','grade.best','grade.good','grade.inacc','grade.mistake','grade.blunder'];
const scores=[100,100,85,60,30,0];
function create(bestOf){bestOf=bestOf===5?5:3;return {bestOf,target:(bestOf+1)/2,score:[0,0],games:[],done:false};}
function snapshot(game){const {match,flopToken,spinFrame,...rest}=game;return JSON.parse(JSON.stringify(rest));}
function append(match,game){if(match.done)return false;match.games.push(snapshot(game));match.score[game.won?0:1]++;match.done=Math.max(...match.score)>=match.target;match.won=match.score[0]>match.score[1];return true;}

function parts(game){return Object.fromEntries(['skill','mind','luck'].map(k=>[k,game.log.reduce((a,e)=>a+(e[k]||0),0)]));}
function turning(game){return game.log.reduce((best,e)=>!best||Math.abs((e.skill||0)+(e.mind||0)+(e.luck||0))>Math.abs((best.skill||0)+(best.mind||0)+(best.luck||0))?e:best,null);}

 const k=['skill','mind','luck'].sort((a,b)=>game.won?p[b]-p[a]:p[a]-p[b])[0];

 if(zh)return `${allOptimal?'每一步都是最优解，':''}${game.won?'赢在':'输在'}${cause}：${detail}。`;

}
function awards(games,won){

 const rank=s=>games.reduce((v,g)=>{for(const e of g.log)if(e.plays?.[s.id]!=null){v[0]++;v[1]+=e.plays[s.id];}return v;},[0,0]);

(function (G) {
  "use strict";
  const B32 = "0123456789abcdefghijklmnopqrstuv";
  let TABLE = null;
  const setTable = (t) => { TABLE = t; };

  const cardsOf = (m) => { const r = []; for (let c = 1; c <= 5; c++) if (m & (1 << (c - 1))) r.push(c); return r; };
  const teamKey = (masks) => masks.slice().sort((a, b) => a - b).map((m) => B32[m]).join("");
  const stateKey = (mine, theirs) => teamKey(mine) + "|" + teamKey(theirs);
  const actKey = (masks, cards) => masks.map((m, k) => m * 8 + cards[k]).sort((a, b) => a - b).join(",");

  function entry(mine, theirs) {
    const e = TABLE[stateKey(mine, theirs)];
    if (!e) throw new Error("state missing from table: " + stateKey(mine, theirs));
    return e;
  }
  /** P(mine wins) with optimal play from here on. */
  function value(mine, theirs) {
    if (!theirs.length) return 1;
    if (!mine.length) return 0;
    return entry(mine, theirs)[0];
  }

  /** Distinct actions up to swapping singers with identical hands; cards aligned with masks. */
  function actions(masks) {
    const seen = new Map(), lists = masks.map(cardsOf), cur = [];
    (function rec(i) {
      if (i === masks.length) {
        const key = actKey(masks, cur);
        if (!seen.has(key)) seen.set(key, { cards: cur.slice(), key });
        return;
      }
      for (const c of lists[i]) { cur.push(c); rec(i + 1); cur.pop(); }
    })(0);
    return [...seen.values()];
  }

  /** Every way the round can end: [{p, mine, theirs, side, idx}] (side 0 = mine eliminated). */
  function outcomes(mine, theirs, a, b) {
    const low = Math.min(...a, ...b), tied = [];
    a.forEach((c, i) => { if (c === low) tied.push([0, i]); });
    b.forEach((c, j) => { if (c === low) tied.push([1, j]); });
    return tied.map(([side, idx]) => ({
      p: 1 / tied.length, side, idx, low, tiedCount: tied.length,
      mine: mine.map((h, i) => h & ~(1 << (a[i] - 1))).filter((_, i) => !(side === 0 && i === idx)),
      theirs: theirs.map((h, j) => h & ~(1 << (b[j] - 1))).filter((_, j) => !(side === 1 && j === idx)),
    }));
  }
  const payoff = (mine, theirs, a, b) => outcomes(mine, theirs, a, b).reduce((s, o) => s + o.p * value(o.mine, o.theirs), 0);

  /** Resolve a real round: the lowest score goes; a tie is broken uniformly at random. */
  function resolve(mine, theirs, a, b, rng) {
    const outs = outcomes(mine, theirs, a, b);
    const o = outs[Math.floor(rng() * outs.length) % outs.length];
    return { ...o, tied: outs.map((t) => [t.side, t.idx]) };
  }

  /** Optimal mixed strategy for `mine`: [{cards (aligned with mine), p}]. */
  function nash(mine, theirs) {
    const order = mine.map((_, i) => i).sort((i, j) => mine[i] - mine[j]);
    return entry(mine, theirs)[1].map(([cs, p]) => {
      const cards = new Array(mine.length);
      order.forEach((idx, k) => { cards[idx] = +cs[k]; });
      return { cards, p };
    });
  }
  function sample(dist, rng) {
    let r = rng() * dist.reduce((s, d) => s + d.p, 0);
    for (const d of dist) { r -= d.p; if (r <= 0) return d; }
    return dist[dist.length - 1];
  }

  // ---------------- Level 1: 愣头青 — mostly sings its best song, sometimes improvises ----------------
  class Rookie {
    constructor(opts = {}) { this.pMax = opts.pMax ?? 0.45; this.last = null; }
    /** This round's mixed strategy: [{cards, p}] (every AI exposes lastMix after choose). */
    mix(mine) {
      const lists = mine.map(cardsOf), n = lists.reduce((k, l) => k * l.length, 1), out = new Map();
      const add = (cards, p) => { const k = cards.join(","); out.set(k, { cards, p: (out.has(k) ? out.get(k).p : 0) + p }); };
      add(lists.map((l) => l[l.length - 1]), this.pMax);
      (function rec(i, cur) {
        if (i === lists.length) return add(cur.slice(), (1 - this.pMax) / n);
        for (const c of lists[i]) { cur.push(c); rec.call(this, i + 1, cur); cur.pop(); }
      }).call(this, 0, []);
      return [...out.values()];
    }
    choose(mine, theirs, round, rng) {
      this.lastMix = this.mix(mine);
      if (rng() < this.pMax) { this.last = { mode: "best" }; return mine.map((m) => Math.max(...cardsOf(m))); }
      this.last = { mode: "random" };
      return mine.map((m) => { const cs = cardsOf(m); return cs[Math.floor(rng() * cs.length)]; });
    }
    observe() {} newGame() {}
  }

  // ---------------- Level 2: 教科书 — exact Nash equilibrium, cannot be exploited ----------------
  class Textbook {
    constructor() { this.last = null; }
    choose(mine, theirs, round, rng) {
      this.last = { mode: "nash" };
      this.lastMix = nash(mine, theirs);
      return sample(this.lastMix, rng).cards;
    }
    observe() {} newGame() {}
  }

  // ---------------- Level 3: 读心评委 — Nash + learns your habits and punishes them ----------------
  /* Habit feature of a human move: which song (ranked from the top of that singer's remaining songs) the
     team's lowest scorer sang, and whether the team split its scores. Counted per round index, kept across
     games (decayed each new game). Prediction = these counts smoothed toward the human's own Nash mix;
     the AI then best-responds to the prediction, but only with probability that grows with evidence, and
     falls back to Nash when the edge is small. */
  class MindReader {
    constructor(saved, opts = {}) {
      this.counts = (saved && saved.counts) || {};      // counts[round][cls] = weight
      this.games = (saved && saved.games) || 0;
      this.alpha = opts.alpha ?? 2.5;                    // prior strength (pseudo-observations of Nash play)
      this.k = opts.k ?? 3;                              // evidence needed for ~half confidence
      this.lamMax = opts.lamMax ?? 0.9;
      this.minGain = opts.minGain ?? 0.02;
      this.decay = opts.decay ?? 0.8;
      this.last = null;
    }
    static classOf(masks, cards) {
      let mi = 0;
      cards.forEach((c, i) => { if (c < cards[mi]) mi = i; });
      const hand = cardsOf(masks[mi]);
      const rank = hand.length - 1 - hand.indexOf(cards[mi]); // 0 = highest remaining
      return rank + (cards.some((c) => c !== cards[mi]) ? "s" : "");
    }
    predict(hu, ai, round) {
      const acts = actions(hu), n = acts.length, eps = 0.03 / n;
      const nmix = new Map(nash(hu, ai).map((d) => [actKey(hu, d.cards), d.p]));
      const byCls = new Map();
      for (const a of acts) {
        a.w = (nmix.get(a.key) || 0) + eps;
        a.cls = MindReader.classOf(hu, a.cards);
        if (!byCls.has(a.cls)) byCls.set(a.cls, 0);
        byCls.set(a.cls, byCls.get(a.cls) + a.w);
      }
      const W = [...byCls.values()].reduce((s, x) => s + x, 0);
      const cnt = this.counts[round] || {};
      let N = 0; for (const c of byCls.keys()) N += cnt[c] || 0;
      const clsP = new Map();
      for (const [c, w] of byCls) clsP.set(c, ((cnt[c] || 0) + this.alpha * w / W) / (N + this.alpha));
      for (const a of acts) a.p = clsP.get(a.cls) * a.w / byCls.get(a.cls);
      return { acts, clsP, N };
    }
    choose(ai, hu, round, rng) {
      const { acts: hActs, clsP, N } = this.predict(hu, ai, round);
      const aActs = actions(ai), live = hActs.filter((h) => h.p > 1e-4);
      for (const a of aActs) a.ev = live.reduce((s, h) => s + h.p * payoff(ai, hu, a.cards, h.cards), 0);
      const nmix = new Map(nash(ai, hu).map((d) => [actKey(ai, d.cards), d.p]));
      const evNash = aActs.reduce((s, a) => s + (nmix.get(a.key) || 0) * a.ev, 0);
      const best = Math.max(...aActs.map((a) => a.ev)), gain = best - evNash;
      const conf = N / (N + this.k), lam = gain > this.minGain ? this.lamMax * conf : 0;
      const pred = [...clsP.entries()].sort((x, y) => y[1] - x[1]);
      if (rng() < lam) {
        const top = aActs.filter((a) => a.ev >= best - 0.01);
        this.last = { mode: "exploit", pred, gain, lam, conf };
        return top[Math.floor(rng() * top.length) % top.length].cards;
      }
      this.last = { mode: "nash", pred, gain, lam, conf };
      return sample(nash(ai, hu), rng).cards;
    }
    observe(hu, cards, round) {
      const c = MindReader.classOf(hu, cards);
      this.counts[round] = this.counts[round] || {};
      this.counts[round][c] = (this.counts[round][c] || 0) + 1;
    }
    newGame() {
      for (const r in this.counts) for (const c in this.counts[r]) this.counts[r][c] *= this.decay;
      this.games++;
    }
    toJSON() { return { counts: this.counts, games: this.games }; }
  }

  // ---------------- Level 3 v2: 读心评委 — several habit models + safe exploitation ----------------
  /* Each "view" describes a human move by one feature of its lowest song; each expert counts that feature
     in some context (Dirichlet counts smoothed toward the human's own Nash mix). Experts are mixed by their
     past predictive log-likelihood (with forgetting). The AI then deviates from Nash toward the best response
     to the mixed prediction, but only as far as a risk budget allows:
       risk <= gifts (expected value the human already gave away this game) + rho * trust * riskCap,
     where rho grows with the evidence that the model predicts the human better than Nash does (LLR), and
     trust shrinks when deviating has recently done worse than Nash would have (the human is baiting it). */
  const clip2 = (d) => Math.max(-2, Math.min(2, d));
  function lowOf(hu, cards) {
    let mi = 0;
    cards.forEach((c, i) => { if (c < cards[mi]) mi = i; });
    return { mi, low: cards[mi], split: cards.some((c) => c !== cards[mi]) };
  }
  const VIEWS = {
    top: (hu, cards) => { const { mi, low, split } = lowOf(hu, cards), h = cardsOf(hu[mi]);
      return (h.length - 1 - h.indexOf(low)) + (split ? "s" : ""); },          // rank from the top of that hand
    abs: (hu, cards) => { const { low, split } = lowOf(hu, cards); return low + (split ? "s" : ""); },
    vsAI: (hu, cards, c) => { if (c.lastAiLow == null) return null; const { low, split } = lowOf(hu, cards);
      return clip2(low - c.lastAiLow) + (split ? "s" : ""); },                  // vs the AI's last lowest song
    vsSelf: (hu, cards, c) => { if (c.lastHuLow == null) return null; const { low, split } = lowOf(hu, cards);
      return clip2(low - c.lastHuLow) + (split ? "s" : ""); },                  // vs their own last lowest song
  };
  const EXPERTS = [   // [id, view, context]
    ["top_r", "top", (c) => "r" + c.round],
    ["top_g", "top", () => "g"],
    ["abs_g", "abs", () => "g"],
    ["vsAI_o", "vsAI", (c) => c.lastOut || "-"],
    ["vsSelf_o", "vsSelf", (c) => c.lastOut || "-"],
    ["top_lead", "top", (c) => "L" + Math.sign(c.nHu - c.nAi)],
  ];
  const EXPERT_IDS = ["nash", ...EXPERTS.map((e) => e[0])];

  class MindReader2 {
    constructor(saved, opts = {}) {
      const s = saved && saved.v === 2 ? saved : {};
      this.counts = s.counts || {};   // counts[expert][context][class]
      this.logw = s.logw || {};       // expert log-weights
      this.llr = s.llr || 0;          // log-likelihood ratio: mixture vs Nash, with forgetting
      this.dev = s.dev || 0;          // recent profit of deviating vs playing Nash (negative = being punished)
      this.games = s.games || 0;
      this.alpha = opts.alpha ?? 1;
      this.gw = opts.gw ?? 0.9;       // forgetting for expert weights (per observed move)
      this.gl = opts.gl ?? 0.85;      // forgetting for the LLR
      this.decay = opts.decay ?? 0.85;
      this.llrScale = opts.llrScale ?? 1;
      this.riskCap = opts.riskCap ?? 0.35;
      this.gd = opts.gd ?? 0.9;       // forgetting for the deviation profit
      this.trustScale = opts.trustScale ?? 0.1;
      this.useTrust = opts.useTrust ?? 1;
      this.g = {};
      this.last = null;
    }
    predict(hu, ai, ctx) {
      const acts = actions(hu), eps = 0.02 / acts.length;
      const nmix = new Map(nash(hu, ai).map((d) => [actKey(hu, d.cards), d.p]));
      const w = acts.map((a) => (nmix.get(a.key) || 0) + eps), W = w.reduce((s, x) => s + x, 0);
      const pe = { nash: w.map((x) => x / W) }, cls = {}, ctxKey = {};
      for (const [id, view, ctxf] of EXPERTS) {
        const cl = acts.map((a) => VIEWS[view](hu, a.cards, ctx));
        cls[id] = cl;
        if (cl[0] == null) { pe[id] = pe.nash; continue; }
        const ck = ctxKey[id] = ctxf(ctx), Wc = new Map();
        cl.forEach((c, i) => Wc.set(c, (Wc.get(c) || 0) + w[i]));
        const cnt = (this.counts[id] && this.counts[id][ck]) || {};
        let N = 0; for (const c of Wc.keys()) N += cnt[c] || 0;
        pe[id] = cl.map((c, i) => (((cnt[c] || 0) + this.alpha * Wc.get(c) / W) / (N + this.alpha)) * w[i] / Wc.get(c));
      }
      const lw = EXPERT_IDS.map((id) => this.logw[id] || 0), mx = Math.max(...lw);
      const ex = lw.map((x) => Math.exp(x - mx)), Z = ex.reduce((s, x) => s + x, 0);
      const pi = Object.fromEntries(EXPERT_IDS.map((id, k) => [id, ex[k] / Z]));
      const p = acts.map((_, j) => EXPERT_IDS.reduce((s, id) => s + pi[id] * pe[id][j], 0));
      return { acts, pe, cls, ctxKey, p, pi };
    }
    choose(ai, hu, round, rng) {
      const g = this.g;
      if (round === 0) Object.assign(g, { lastAiLow: null, lastHuLow: null, lastOut: null, budget: 0 });
      else g.lastOut = hu.length < g.prevHu ? "hu" : "ai";
      const ctx = { round, lastOut: g.lastOut, lastAiLow: g.lastAiLow, lastHuLow: g.lastHuLow, nHu: hu.length, nAi: ai.length };
      const P = this.predict(hu, ai, ctx), hActs = P.acts, aActs = actions(ai);
      const M = aActs.map((a) => hActs.map((h) => payoff(ai, hu, a.cards, h.cards)));
      const nmix = new Map(nash(ai, hu).map((d) => [actKey(ai, d.cards), d.p]));
      const xN = aActs.map((a) => nmix.get(a.key) || 0);
      const v = value(ai, hu);
      const ev = M.map((row) => row.reduce((s, m, j) => s + m * P.p[j], 0));
      let br = 0;
      ev.forEach((e, i) => { if (e > ev[br] + 1e-12 || (Math.abs(e - ev[br]) <= 1e-12 && xN[i] > xN[br])) br = i; });
      const colN = hActs.map((_, j) => xN.reduce((s, x, i) => s + x * M[i][j], 0));
      const evN = xN.reduce((s, x, i) => s + x * ev[i], 0);
      const rho = 1 - Math.exp(-Math.max(0, this.llr) / this.llrScale);
      const trust = this.useTrust ? Math.exp(Math.min(0, this.dev) / this.trustScale) : 1;
      const R = Math.max(0, g.budget) + rho * trust * this.riskCap;
      let lam = 0, best = evN;
      for (let k = 1; k <= 20; k++) {
        const l = k / 20;
        let worst = Infinity;
        for (let j = 0; j < hActs.length; j++) worst = Math.min(worst, (1 - l) * colN[j] + l * M[br][j]);
        const obj = (1 - l) * evN + l * ev[br];
        if (v - worst <= R + 1e-3 && obj > best + 1e-9) { best = obj; lam = l; }
      }
      const x = xN.map((p, i) => (1 - lam) * p + (i === br ? lam : 0));
      this.lastMix = aActs.map((a, i) => ({ cards: a.cards, p: x[i] })).filter((d) => d.p > 1e-9);
      const pick = sample(x.map((p, i) => ({ p, i })), rng).i, cards = aActs[pick].cards;
      const predMin = {};
      hActs.forEach((h, j) => { const lo = Math.min(...h.cards); predMin[lo] = (predMin[lo] || 0) + P.p[j]; });
      g.pending = { P, M, x, xN, v };
      g.prevHu = hu.length;
      g.lastAiLow = Math.min(...cards);
      this.last = { mode: lam > 0 && pick === br ? "exploit" : "nash", lam, rho, trust, budget: g.budget,
                    predMin: Object.entries(predMin).map(([k, q]) => [+k, q]).sort((a, b) => b[1] - a[1]),
                    gain: ev[br] - evN, weights: P.pi };
      return cards;
    }
    observe(hu, cards) {
      const g = this.g, pd = g.pending;
      if (!pd) return;
      const key = actKey(hu, cards), j = pd.P.acts.findIndex((h) => h.key === key);
      if (j < 0) return;
      this.llr = this.gl * this.llr + Math.log(pd.P.p[j] / pd.P.pe.nash[j]);
      for (const id of EXPERT_IDS) this.logw[id] = this.gw * (this.logw[id] || 0) + Math.log(pd.P.pe[id][j]);
      for (const [id] of EXPERTS) {
        const c = pd.P.cls[id][j];
        if (c == null) continue;
        const ck = pd.P.ctxKey[id];
        this.counts[id] = this.counts[id] || {};
        this.counts[id][ck] = this.counts[id][ck] || {};
        this.counts[id][ck][c] = (this.counts[id][ck][c] || 0) + 1;
      }
      const got = pd.x.reduce((s, x, i) => s + x * pd.M[i][j], 0), gotN = pd.xN.reduce((s, x, i) => s + x * pd.M[i][j], 0);
      g.budget += got - pd.v;                                              // what the human gave away
      if (Math.abs(got - gotN) > 1e-9) this.dev = Math.min(0.3, this.gd * this.dev + (got - gotN));
      g.lastHuLow = Math.min(...cards);
      g.pending = null;
    }
    newGame() {
      for (const id in this.counts) for (const ck in this.counts[id]) for (const c in this.counts[id][ck]) this.counts[id][ck][c] *= this.decay;
      this.games++;
      this.g = {};
    }
    /** Strongest learned habits: [{expert, view, ctx, cls, share, n, weight}], most convincing first. */
    habits(limit = 3) {
      const lw = EXPERT_IDS.map((id) => this.logw[id] || 0), mx = Math.max(...lw);
      const ex = lw.map((x) => Math.exp(x - mx)), Z = ex.reduce((s, x) => s + x, 0);
      const pi = Object.fromEntries(EXPERT_IDS.map((id, k) => [id, ex[k] / Z]));
      const out = [];
      for (const [id, view] of EXPERTS) {
        for (const [ck, cnt] of Object.entries(this.counts[id] || {})) {
          const n = Object.values(cnt).reduce((s, x) => s + x, 0);
          if (n < 1.5) continue;
          const [cls, w] = Object.entries(cnt).sort((a, b) => b[1] - a[1])[0];
          if (w / n < 0.5) continue;
          out.push({ expert: id, view, ctx: ck, cls, share: w / n, n, weight: pi[id], score: pi[id] * (w / n) * Math.min(1, n / 3) });
        }
      }
      return out.sort((a, b) => b.score - a.score).slice(0, limit);
    }
    toJSON() { return { v: 2, counts: this.counts, logw: this.logw, llr: this.llr, dev: this.dev, games: this.games }; }
  }

  /** Judge a move after the round, from the mover's side ("mine").
      opp = the opponent's actual mixed strategy that round [{cards, p}] (committed before the move),
      oppCards = what it actually sang, after = [mine, theirs] masks after the round.
      Splits the change in win chance (after - v) into three parts that sum exactly:
        skill = q - v        what the choice was worth against the opponent's actual strategy
        mind  = pa - q       how the opponent's actual pick (one sample of its mix) landed for you
        luck  = after - pa   the tie draw
      regret = best - q: how much better the best reply to that strategy would have done. */
  function analyzeMove(mine, theirs, cards, opp, oppCards, after) {
    const ev = (h, mix) => mix.reduce((s, d) => s + d.p * payoff(mine, theirs, h, d.cards), 0);
    const v = value(mine, theirs), q = ev(cards, opp), qN = ev(cards, nash(theirs, mine));
    let best = -1, bestCards = null;
    for (const h of actions(mine)) { const e = ev(h.cards, opp); if (e > best + 1e-12) { best = e; bestCards = h.cards; } }
    const pa = payoff(mine, theirs, cards, oppCards), vAfter = value(after[0], after[1]);
    return { v, q, qN, best, bestCards, regret: Math.max(0, best - q), theoryLoss: Math.max(0, v - qN),
             skill: q - v, mind: pa - q, luck: vAfter - pa, after: vAfter };
  }

  const api = { analyzeMove, setTable, cardsOf, stateKey, value, actions, actKey, outcomes, payoff, resolve, nash, sample,
                Rookie, Textbook, MindReader, MindReader2, FULL: 31 };
  if (typeof module !== "undefined" && module.exports) module.exports = api; else G.SingerAI = api;

    if (eff < 0.03) return "grade.good";
    if (eff < 0.08) return "grade.inacc";
    if (eff < 0.15) return "grade.mistake";
    return "grade.blunder";

  function spark(hist, keyRound) {
    const W = 320, H = 104, x0 = 36, x1 = W - 12, y = (v) => 10 + (1 - v) * 72;
    const n = hist.length, x = (i) => x0 + (n === 1 ? 0 : (i * (x1 - x0)) / (n - 1));
    const pts = hist.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
    const dots = hist.map((v, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="${i === n - 1 ? 4.5 : 3}" fill="var(--you)"/>`).join("");
    const xl = hist.map((_, i) => `<text x="${x(i).toFixed(1)}" y="${H - 4}" text-anchor="middle">${i === 0 ? t("spark.start") : t("spark.round", { round: i })}</text>`).join("");
    return `<svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="${attr(t("spark.aria"))}">
      <line x1="${x0}" x2="${x1}" y1="${y(0.5)}" y2="${y(0.5)}" stroke="var(--line)" stroke-dasharray="4 4"/>
      <line x1="${x0}" x2="${x1}" y1="${y(1)}" y2="${y(1)}" stroke="var(--line)"/>
      <line x1="${x0}" x2="${x1}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)"/>
      <text x="${x0 - 6}" y="${y(1) + 3}" text-anchor="end">100%</text>
      <text x="${x0 - 6}" y="${y(0.5) + 3}" text-anchor="end">50%</text>
      <text x="${x0 - 6}" y="${y(0) + 3}" text-anchor="end">0%</text>
      <polyline points="${pts}" fill="none" stroke="var(--you)" stroke-width="2.5" stroke-linejoin="round"/>
      ${keyRound!=null?`<line class="turn-marker" x1="${x(keyRound+1)}" x2="${x(keyRound+1)}" y1="6" y2="86" stroke="var(--brass)" stroke-dasharray="2 3"/><circle cx="${x(keyRound+1)}" cy="${y(hist[keyRound+1])}" r="6" fill="none" stroke="var(--brass)"/>`:""}${dots}${xl}</svg>`;
  }

  function gameReview(game, gameIndex) {
    const parts=MM.parts(game),key=MM.turning(game),counts=MM.distribution(game);
    const distribution=MM.grades.map(k=>`${t(k)} ${counts[k]}`).join(" · ");
    const label=lang==="zh"?"出招质量":"Move quality";
    const row=(k,zh,en,exZh,exEn)=>`<div class="review-part"><b>${lang==="zh"?zh:en} ${pts(parts[k])}</b><span>— ${lang==="zh"?exZh:exEn}</span></div>`;
    const table=game.log.map((e,i)=>`<button type="button" class="round-review-row" data-round-review="${i}" data-game-index="${gameIndex??""}"><span>R${e.round+1} ${lang==="zh"?"你":"You"} ${e.you.join("·")} vs ${lang==="zh"?"对手":"Rival"} ${e.ai.join("·")}</span><span>${who(singer(e.outId,game))} ${t("stamp.out")} · ${t(e.gradeKey)} · ${pct(game.winHist[i])}→${pct(game.winHist[i+1])}</span></button>`).join("");
    const equation=`${pts(parts.skill)} + (${pts(parts.mind)}) + (${pts(parts.luck)}) = ${pts(parts.skill+parts.mind+parts.luck)}`;
    return `<section class="game-review"><p class="diagnosis">${MM.diagnosis(game,lang)}</p><p class="move-quality"><b>${label} ${MM.quality(game)}%</b><small>${lang==="zh"?"100% = 每步都在最优解里":"100% = every move is optimal"}</small></p><p class="grade-distribution">${distribution}</p><div class="review-breakdown">${row("skill","出招","Moves","你的选择本身的得失","gains/losses from your choices")}${row("mind","猜招","Guessing","对手随机出招押中/押空你","rival random picks hit/miss yours")}${row("luck","抽签","Draw","同分抽签的运气","luck in tied-lowest draws")}<small class="review-sum">${equation} ${lang==="zh"?"点 = 最终结果 − 50":"points = final result − 50"} (${game.won?100:0} − 50)</small></div><div class="chart-caption">${lang==="zh"?"你的胜率":"Your win chance"}${key?` · ${lang==="zh"?"转折":"Turning point"} R${key.round+1}`:""}</div>${spark(game.winHist,key?.round)}<div class="round-review-table">${table}</div>${game.level==="textbook"?`<p class="theory-line">${lang==="zh"?"对手是完美策略：长期最多打平，单局输赢看猜招和抽签。":"The rival plays perfectly: at best you draw in the long run. Individual games turn on guessing and tie draws."}</p>`:""}</section>`;
  }

    if (el.dataset.lang) return setLanguage(el.dataset.lang);
    if (el.classList.contains("level")) return newGame(el.dataset.level);
    if (el.id === "btn-sound") return Sound.toggle();
    if (el.id === "btn-shuffle") return setLineup(pickLineup(3));
    if (el.dataset.slot != null) return openRoster(+el.dataset.slot);
    if (el.dataset.flop) { if(S)S.flopToken=null; return Theater.open(el.dataset.flop,{unlock:true}); }
    if (el.dataset.clip) return Theater.open(el.dataset.clip);
    if (el.id === "btn-rules") return openSheet("rules");
    if (el.id === "btn-review") return openSheet("round");
    if (el.id === "btn-final-review") return openSheet("final");
    if (el.id === "btn-mvp") return showMvp();
    if (el.id === "btn-menu" || el.id === "btn-levels") return showMenu();
    if (!S) return;
    if (el.dataset.all && S.phase === "pick") return chooseAll(+el.dataset.all);
    if (el.id === "btn-sing") return S.phase === "pick" ? sing() : nextRound();
    if (el.id === "btn-again" && S.match&&!S.match.done)return nextGame();
    if (el.id === "btn-again") return S.daily ? newGame(S.level, S.daily) : newGame(S.level);
    if (el.id === "btn-encore") {
      const w = awards().mvp;
      return w && Theater.open(concertId(w));
    }
    if (el.id === "btn-copy") {
      const txt = report();
      const fallback = () => { const ta = $("#report-text"); ta.hidden = false; ta.value = txt; ta.focus(); ta.select(); toast("toast.manual"); };
      try { navigator.clipboard.writeText(txt).then(() => toast("toast.copied"), fallback); } catch (e) { fallback(); }
    }
  });
  document.addEventListener("keydown", (ev) => {
    Sound.unlock();
    if(window.GameDialogs.active()) return;
    if (ev.key === "Escape" && document.getElementById("mvp")) { closeMvp(); return; }
    if (!S || ev.metaKey || ev.ctrlKey || ev.altKey) return;
    if (/^[1-5]$/.test(ev.key) && S.phase === "pick") {
      ev.preventDefault(); chooseAll(+ev.key);
    } else if (ev.key === "Enter" && (S.phase === "pick" || S.phase === "result") && document.activeElement.tagName !== "BUTTON") {
      S.phase === "pick" ? sing() : nextRound();
    }
  });

  // Deterministic layout fixtures are opt-in. Normal play never reads this parameter.
  if (new URLSearchParams(window.location?.search || "").get("qa") === "1") {
    const states = ["cover","roster","pick","pick-partial","pick-ready","reveal-spin","reveal","tie","result","review","over-win","over-lose","final-review","mvp-win","mvp-lose","flop","rules","series-interstitial","match-review"];
    window.__gameQA = {
      states,
      audioState:()=>({soundOn:Sound.on,foreground:Sound.cur?.url||null}),
      setHands(masks) {
        const team = S?.phase === "pick" ? alive(S.you) : [];
        if (!team.length || masks.length !== team.length || !masks.every(m=>Number.isInteger(m)&&m>=1&&m<=31)) throw new Error("Show a pick fixture first; provide one hand mask (1–31) per alive maestro.");
        team.forEach((s,i)=>s.mask=masks[i]); S.pick=TM.initialPicks(S.you); render();
      },
      async show(state, language = lang, level = "textbook") {
        if (!states.includes(state)) throw new Error("Unknown QA state: " + state);
        window.GameDialogs.closeAll(); closeSheet(); reelInput.cancel(); closeMvp(); Theater.close();
        setLanguage(language);
        if (["cover","roster","rules"].includes(state)) {
          showMenu(); if (state === "roster") openRoster(0); if (state === "rules") openSheet("rules");
          return {state, phase:"cover"};
        }
        await newGame(level, "2026-10-11");
        if (state === "pick") return {state, phase:S.phase};
        if (state === "pick-partial" || state === "pick-ready") {
          S.pick[S.you[0].id] = 3;
          if (state === "pick-ready") S.you.forEach((s,i)=>S.pick[s.id]=i+2);
          render(); return {state,phase:S.phase};
        }
        const lose = state.endsWith("lose"), tied = state === "tie";
        const yM = masks(S.you), aM = masks(S.ai), yC = lose ? [2,3,4] : [4,4,4], aC = tied ? [4,4,4] : [2,3,4];
        if (lose) aC.fill(4);
        const out = lose ? S.you[0] : S.ai[0], low = tied ? 4 : 2;
        const outcome = resolve(aM,yM,aC,yC,()=>0);
        const full = analyzeMove(yM,aM,yC,S.aiMix.length ? S.aiMix : nash(aM,yM),aC,[outcome.theirs,outcome.mine]);
        const an = {regret:full.regret,theoryLoss:full.theoryLoss,skill:full.skill,mind:full.mind,luck:full.luck,best:full.bestCards,bestP:full.best};
        const plays = {};
        S.revealLevels = Object.fromEntries([...S.you,...S.ai].map(s=>[s.id,TM.remaining(s.mask)]));
        S.aiCards = aC; S.commit = {text:`R1|${aC.join(",")}|qa0000`,hash:null}; S.commit.hash = await sha8(S.commit.text);
        S.you.forEach((s,i)=>{S.pick[s.id]=yC[i];s.shown=yC[i];s.mask &= ~(1 << (yC[i]-1));plays[s.id]=yC[i];});
        S.ai.forEach((s,i)=>{s.shown=aC[i];s.mask &= ~(1 << (aC[i]-1));plays[s.id]=aC[i];});
        const flop = {kind:TM.kindForScore(low),clip:TM.clipId(out.ref,pieceOf(out).id,TM.kindForScore(low))};
        S.result = {kind:["reveal","reveal-spin"].includes(state) ? "reveal" : tied ? "tie" : "done",low,tiedN:tied?6:1,tiedYou:tied?3:lose?1:0,tiedRival:tied?3:lose?0:1,outId:out.id,mine:lose,an,gradeKey:grade(an),ideal:nash(yM,aM).slice(0,3),read:null,commit:S.commit,flop};
        S.lowIds = state === "reveal-spin" ? [] : tied ? [...S.you,...S.ai].map(s=>s.id) : [out.id]; S.cursorId = tied ? S.you[1].id : null;
        S.spin = state === "reveal-spin"; S.spinFrame = S.spin;
        S.phase = ["reveal","reveal-spin","tie"].includes(state) ? "reveal" : "result";
        if (S.phase === "result") {
          out.alive = false; S.outId = out.id;
          S.log = [{round:0,you:yC,ai:aC,low,tiedN:S.result.tiedN,plays,flop,outId:out.id,mine:lose,gradeKey:S.result.gradeKey,skill:an.skill,mind:an.mind,luck:an.luck,regret:an.regret,theoryLoss:an.theoryLoss,detail:JSON.parse(JSON.stringify(S.result))}];
          S.winHist.push(value(masks(S.you),masks(S.ai)));
        }
        if (/^(over-|mvp-)/.test(state) || ["final-review","series-interstitial","match-review"].includes(state)) {
          S.phase = "over"; S.won = !lose; S.round = 2;
          (lose ? S.you : S.ai).forEach(s=>s.alive=false);
          S.winHist = [.5,.65,.4,lose?0:1]; S.log = [0,1,2].map(round=>({...S.log[0],round,skill:0,mind:S.winHist[round+1]-S.winHist[round],luck:0,gradeKey:"grade.best"}));
        }
        if(state === "series-interstitial" || state === "match-review" || /^(over-|mvp-)/.test(state)) {
          S.daily=null;S.match=MM.create(3);
          const fixtureGame=won=>{const g=MM.snapshot(S);g.won=won;g.winHist=[.5,.65,.4,won?1:0];g.log=g.log.map((e,i)=>({...e,skill:0,mind:g.winHist[i+1]-g.winHist[i],luck:0}));return g;};
          if(state === "series-interstitial")MM.append(S.match,fixtureGame(true));
          else [!lose,lose,!lose].forEach(won=>MM.append(S.match,fixtureGame(won)));
        }
        render();
        if(state === "series-interstitial")openSheet("interstitial");
        if(state === "match-review")openSheet("final");
        if(state === "review") openSheet("round");
        if(state === "final-review") openSheet("final");
        if(state.startsWith("mvp-")) showMvp();
        if(state === "flop") Theater.open(flop.clip,{label:`${singerName(out)} · ${pieceOf(out).title[lang]} · ${t("act.single",{card:low})}`});

        return {state, phase:S.phase};
      }
    };
  }

  // ---------- boot (keeps a game in progress across page updates) ----------
  const hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) hot.snapshot(() => ({ S: stable }));
  const boot = (data) => {
    if (data && data.S && data.S.result && data.S.you && byId[data.S.you[0].ref] && LEVELS[data.S.level] && data.S.phase !== "reveal") {
      S = data.S; S.cursorId = null; ai = LEVELS[S.level].make();
      if(!S.daily&&!S.match){S.match=MM.create(bestOf);if(S.phase==="over"){S.recorded=true;MM.append(S.match,S);}}
      showScreen(false);
      render();
    } else showMenu();
  };
  if (hot && hot.ready) hot.ready(boot); else boot((hot && hot.data) || {});
})();
</script>
