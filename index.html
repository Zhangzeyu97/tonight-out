/* Layout: one narrow stage column. Rival lanes on top, the reveal strip in the middle, your lanes and a sticky
   action bar at the bottom. One deliberate world (a show stage at night), so a single dark palette by choice. */
:root {
  color-scheme: dark;
  --curtain: #1f0810;
  --velvet: #34101a;
  --velvet-hi: #461724;
  --brass: #f2c46a;
  --cream: #fff0db;
  --muted: #c9a7ae;
  --you: #72e3cf;
  --rival: #ff86a8;
  --low: #ff5b4d;
  --line: rgba(255, 240, 219, .14);
  --ghost-ink: rgba(255, 240, 219, .26);
  --shade: rgba(0, 0, 0, .32);
  --spot: rgba(255, 226, 170, .16);
  --pleat: rgba(0, 0, 0, .16);
  --brass-soft: rgba(242, 196, 106, .14);
  --brass-line: rgba(242, 196, 106, .32);
  --you-soft: rgba(114, 227, 207, .2);
  --low-soft: rgba(255, 91, 77, .2);
  --panel: #14040a;
  --frame-hi: #7a5219;
  --frame-lo: #2b1907;
  --bulb: #fff3cc;
  --bulb-halo: rgba(255, 208, 110, .5);
  --beam: rgba(255, 236, 190, .2);
  --stage-glow: rgba(242, 196, 106, .22);
  --plank: rgba(0, 0, 0, .3);
  --floor-hi: #3d1a14;
  --floor-lo: #12040a;
  /* display + digit faces are subset WOFF2 embedded by build.py (ZCOOL QingKe HuangYou, Big Shoulders Display; OFL) */
  --display: "TO Display", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  --digits: "TO Digits", Impact, "Arial Narrow", sans-serif;
  --body: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", system-ui, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { height: 100%; background: var(--curtain); }
body {
  min-height: 100%; margin: 0; color: var(--cream); font-family: var(--body); font-size: 15px; line-height: 1.55;
  background:
    radial-gradient(ellipse 80% 36% at 50% 0%, var(--spot), transparent 72%),
    repeating-linear-gradient(90deg, var(--pleat) 0 18px, transparent 18px 36px),
    var(--curtain);
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
.wrap { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 8px 0; display: flex; flex-direction: column; gap: 14px; }

/* header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-block: 8px 0; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; flex-wrap: wrap; }
.logo { font-family: var(--display); font-size: 1.45rem; color: var(--brass); letter-spacing: .04em; }
.tag { font-size: .72rem; color: var(--muted); letter-spacing: .1em; }
.top-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; margin-left: auto; }
.ghost { background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: .82rem; cursor: pointer; }
.ghost:hover { border-color: var(--brass-line); }

.lang-toggle { display: flex; align-items: center; gap: 1px; border: 1px solid var(--line); border-radius: 999px; padding: 2px; font-size: .74rem; }
.lang-toggle button { border: 0; background: transparent; color: var(--muted); padding: 2px 5px; border-radius: 999px; cursor: pointer; }
.lang-toggle button[aria-pressed="true"] { background: var(--brass); color: var(--curtain); }
.lang-toggle > span { color: var(--muted); }

/* cover: a theatre marquee sign, then a stage that loops one round of the game */
#menu { display: grid; gap: 16px; padding-bottom: 28px; }
.marquee { position: relative; padding: 15px; border-radius: 20px; isolation: isolate;
  background: linear-gradient(160deg, var(--frame-hi), var(--frame-lo) 70%);
  box-shadow: 0 0 0 1px var(--brass-line), 0 22px 60px var(--shade), 0 0 70px var(--brass-soft); }
.marquee::before, .marquee::after { content: ""; position: absolute; inset: 0; border-radius: inherit; z-index: 0;
  background-size: 30px 30px; background-repeat: round; animation: bulbs 1.3s steps(1) infinite; }
.marquee::before { background-image:
  radial-gradient(circle at 25% 25%, var(--bulb) 0 2.6px, var(--bulb-halo) 3.4px, transparent 6px),
  radial-gradient(circle at 75% 75%, var(--bulb) 0 2.6px, var(--bulb-halo) 3.4px, transparent 6px); }
.marquee::after { background-image:
  radial-gradient(circle at 75% 25%, var(--bulb) 0 2.6px, var(--bulb-halo) 3.4px, transparent 6px),
  radial-gradient(circle at 25% 75%, var(--bulb) 0 2.6px, var(--bulb-halo) 3.4px, transparent 6px);
  animation-delay: -.65s; }
@keyframes bulbs { 0% { opacity: 1; } 50% { opacity: .22; } }
.marquee-inner { position: relative; z-index: 1; border-radius: 8px; padding: 16px 14px 14px; text-align: center;
  background: radial-gradient(ellipse 90% 70% at 50% 0%, var(--brass-soft), transparent 70%), var(--panel);
  box-shadow: inset 0 0 0 1px var(--brass-line), inset 0 0 40px var(--shade); }
.hero { font-family: var(--display); font-weight: 400; font-size: clamp(3rem, 15vw, 5.2rem); line-height: .95; margin: 0; letter-spacing: .04em;
  text-shadow: 0 0 2px var(--cream), 0 0 28px rgba(242, 196, 106, .45); }
.hero em { font-style: normal; color: var(--brass); }
.hook { margin: 10px 0 0; color: var(--muted); font-size: .92rem; text-wrap: balance; }

.stage { position: relative; height: 178px; border-radius: 16px; overflow: hidden; border: 1px solid var(--line);
  background: radial-gradient(ellipse 75% 50% at 50% 100%, var(--stage-glow), transparent 72%), linear-gradient(180deg, var(--panel), var(--curtain)); }
.valance { position: absolute; inset: 0 0 auto; height: 28px; z-index: 3;
  background: radial-gradient(circle at 50% 0, var(--velvet-hi) 0 68%, transparent 70%) 0 0 / 30px 28px repeat-x;
  filter: drop-shadow(0 5px 6px var(--shade)); }
.beam { position: absolute; top: -10px; width: 46%; height: 260px; z-index: 1; transform-origin: 50% 0;
  background: linear-gradient(180deg, var(--beam), transparent 90%); clip-path: polygon(46% 0, 54% 0, 100% 100%, 0 100%); }
.beam-l { left: 2%; animation: sway 7s ease-in-out infinite alternate; }
.beam-r { right: 2%; animation: sway 7s ease-in-out -3.5s infinite alternate-reverse; }
@keyframes sway { from { transform: rotate(-22deg); } to { transform: rotate(16deg); } }
.floor { position: absolute; left: 0; right: 0; bottom: 0; height: 30px; z-index: 1;
  background: repeating-linear-gradient(90deg, var(--plank) 0 1px, transparent 1px 38px), linear-gradient(180deg, var(--floor-hi), var(--floor-lo)); }
.cast { position: absolute; left: 0; right: 0; bottom: 18px; z-index: 2; display: flex; align-items: flex-end; justify-content: center; gap: 8px; }
.crew { display: flex; gap: 6px; }
.star { position: relative; display: grid; justify-items: center; gap: 7px; }
.crew.rival .star { --ring: var(--rival); }
.crew.you .star { --ring: var(--you); }
.card { width: 36px; height: 42px; border-radius: 6px; display: grid; place-items: center; perspective: 200px;
  background: var(--panel); border: 1px solid var(--brass-line); box-shadow: 0 6px 14px var(--shade);
  font-family: var(--digits); font-weight: 900; font-size: 1.7rem; line-height: 1; color: var(--brass); font-variant-numeric: tabular-nums; }
.card .q { color: var(--muted); font-size: 1.2rem; }
.card.flip span { display: inline-block; animation: flip .4s cubic-bezier(.2, .8, .2, 1) both; animation-delay: var(--d, 0ms); }
.ava { width: 44px; height: 44px; border-radius: 50%; overflow: hidden; padding: 0; border: 0;
  background: var(--shade); box-shadow: 0 0 0 2px var(--ring), 0 10px 20px var(--shade); transition: box-shadow .12s, opacity .4s, transform .15s; }
button.ava { cursor: pointer; }
button.ava:hover { transform: translateY(-2px); box-shadow: 0 0 0 3px var(--you), 0 10px 20px var(--shade); }
.lineup-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: -8px; font-size: .8rem; color: var(--muted); flex-wrap: wrap; }
.star.low .card { color: var(--low); border-color: var(--low); box-shadow: 0 0 16px var(--low-soft); }
.star.cursor .ava { box-shadow: 0 0 0 3px var(--brass), 0 0 22px var(--brass); }
.star.out .ava, .star.out .card { opacity: .3; }
.star.out::after { content: attr(data-out); position: absolute; left: 50%; top: 58%; transform: translate(-50%, -50%) rotate(-7deg);
  font-family: var(--display); font-size: 1rem; line-height: 1.3; color: var(--low); border: 2px solid var(--low); border-radius: 4px;
  padding: 0 5px; background: var(--curtain); white-space: nowrap; animation: stamp .35s cubic-bezier(.3, 1.6, .5, 1) both; }
.vs { font-family: var(--digits); font-weight: 900; font-size: 1.15rem; color: var(--muted); padding-bottom: 14px; letter-spacing: .04em; }

.rules-c { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; counter-reset: rule; }
.rules-c li { counter-increment: rule; display: flex; gap: 8px; align-items: baseline; padding: 9px 11px; border-radius: 10px;
  background: var(--shade); border: 1px solid var(--line); font-size: .84rem; line-height: 1.4; text-wrap: pretty; }
.rules-c li::before { content: counter(rule); font-family: var(--digits); font-weight: 900; font-size: 1.1rem; color: var(--brass); }
.rules { background: var(--shade); border: 1px solid var(--line); border-radius: 14px; padding: 10px; }
.rules .rules-c li { background: transparent; padding: 5px 8px; }
.sect { font-family: var(--display); font-weight: 400; font-size: 1.15rem; letter-spacing: .08em; color: var(--brass); margin: 2px 0 -6px; }
.levels { display: grid; gap: 10px; }
.level { display: grid; grid-template-columns: auto 1fr auto; gap: 2px 12px; align-items: center; text-align: left; padding: 12px 16px; background: var(--velvet); border: 1px solid var(--line); border-radius: 14px; cursor: pointer; transition: border-color .2s, background .2s, transform .2s; }
.level:hover { border-color: var(--brass-line); background: var(--velvet-hi); transform: translateY(-1px); }
.tier { font-family: var(--display); font-size: .9rem; color: var(--curtain); padding: 0 8px; border-radius: 4px; letter-spacing: .08em; }
.level[data-level="rookie"] .tier { background: var(--you); }
.level[data-level="textbook"] .tier { background: var(--brass); }
.level[data-level="reader"] .tier { background: var(--rival); }
.lname { font-family: var(--display); font-size: 1.5rem; line-height: 1.2; }
.rec { font-family: var(--digits); font-weight: 700; color: var(--muted); font-size: 1.05rem; letter-spacing: .04em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.ldesc { grid-column: 1 / -1; color: var(--muted); font-size: .86rem; }

/* board */
#game { display: grid; gap: 12px; }
.team { display: grid; gap: 6px; }
.team-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; font-size: .78rem; color: var(--muted); }
.side { font-family: var(--display); font-size: 1.1rem; letter-spacing: .06em; }
.rival .side { color: var(--rival); }
.you .side { color: var(--you); }
.lock { margin-left: auto; font-variant-numeric: tabular-nums; }
.lanes { display: grid; gap: 6px; }
.lane { position: relative; display: grid; grid-template-columns: 60px minmax(0, 1fr) 52px; align-items: center; gap: 10px; padding: 6px 10px; background: var(--velvet); border-radius: 12px; border: 1px solid var(--line); transition: box-shadow .12s, opacity .4s; }
.lane.you { --ring: var(--you); }
.lane.rival { --ring: var(--rival); }
.who { display: flex; flex-direction: column; align-items: center; line-height: 1.15; min-width: 0; }
.mask { width: 2.5rem; height: 2.5rem; display: block; border-radius: 50%; overflow: hidden; background: var(--shade); box-shadow: 0 0 0 2px var(--ring); }
.mask svg, .mask img, .ava svg, .ava img { width: 100%; height: 100%; display: block; }
.nm { font-size: .72rem; color: var(--muted); margin-top: 3px; white-space: nowrap; }
.chips { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 5px; max-width: 230px; }
.chip { aspect-ratio: 1; max-width: 100%; display: grid; place-items: center; border-radius: 9px; border: 1px solid var(--line); background: var(--shade); font-family: var(--digits); font-weight: 700; font-size: 1.3rem; line-height: 1; color: var(--cream); padding: 0; font-variant-numeric: tabular-nums; }
button.chip { cursor: pointer; }
button.chip:hover:not(:disabled) { border-color: var(--you); }
button.chip:disabled { cursor: default; }
.chip.used { color: var(--ghost-ink); text-decoration: line-through; background: transparent; border-style: dashed; }
.chip.sel { background: var(--you); color: var(--curtain); border-color: var(--you); }
.chip.now { border: 2px solid var(--brass); border-style: solid; color: var(--brass); text-decoration: none; }
.score { font-family: var(--digits); font-weight: 900; font-size: 2.4rem; line-height: 1; text-align: center; font-variant-numeric: tabular-nums; perspective: 300px; }
.score .q { color: var(--muted); font-size: 1.5rem; }
.score .pend { color: var(--you); opacity: .6; }
.score.flip span { display: inline-block; animation: flip .45s cubic-bezier(.2, .8, .2, 1) both; animation-delay: var(--d, 0ms); }
@keyframes flip { from { transform: rotateX(90deg); opacity: 0; } to { transform: none; opacity: 1; } }
.lane.low .score { color: var(--low); text-shadow: 0 0 18px rgba(255, 91, 77, .55); }
.lane.cursor { box-shadow: 0 0 0 2px var(--brass), 0 0 26px rgba(242, 196, 106, .35); }
.lane.out .who, .lane.out .chips, .lane.out .score { opacity: .32; }
.lane.out::after { content: attr(data-out); position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(-7deg); font-family: var(--display); font-size: 1.5rem; color: var(--low); border: 2px solid var(--low); padding: 0 10px; border-radius: 6px; letter-spacing: .14em; background: var(--curtain); }
.lane.justout::after { animation: stamp .35s cubic-bezier(.3, 1.6, .5, 1) both; }
@keyframes stamp { from { transform: translate(-50%, -50%) rotate(-7deg) scale(1.8); opacity: 0; } to { transform: translate(-50%, -50%) rotate(-7deg) scale(1); opacity: 1; } }

/* reveal strip */
.strip { display: grid; gap: 8px; padding: 12px 14px; border-radius: 14px; background: var(--brass-soft); border: 1px solid var(--brass-line); }
.strip-top { display: flex; justify-content: space-between; align-items: center; gap: 8px 12px; flex-wrap: wrap; }
.round { font-family: var(--display); font-size: 1.3rem; color: var(--brass); letter-spacing: .04em; }
.round small { font-family: var(--body); font-size: .72rem; color: var(--muted); letter-spacing: 0; margin-left: 6px; }
.meter { display: flex; align-items: center; gap: 8px; font-size: .74rem; color: var(--muted); }
.bar { width: 110px; height: 8px; border-radius: 99px; background: var(--rival); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--you); transition: width .6s; }
.meter b { font-family: var(--digits); font-size: 1.05rem; color: var(--you); font-variant-numeric: tabular-nums; min-width: 3ch; text-align: right; }
.banner { font-size: 1rem; min-height: 1.55em; }
.banner strong { font-weight: 700; }
.banner .good { color: var(--you); }
.banner .bad { color: var(--low); }
.insight { font-size: .84rem; color: var(--muted); display: grid; gap: 5px; }
.insight:empty { display: none; }
.insight .row { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.grade { display: inline-block; padding: 0 8px; border-radius: 99px; font-size: .76rem; font-weight: 700; white-space: nowrap; }
.g-brill { background: linear-gradient(90deg, var(--brass), var(--you)); color: var(--curtain); }
.g-best { background: var(--you); color: var(--curtain); }
.g-good { background: var(--you-soft); color: var(--you); }
.g-inacc { background: var(--brass-soft); color: var(--brass); }
.g-mistake { background: var(--low-soft); color: var(--low); }
.g-blunder { background: var(--low); color: var(--curtain); }
.comps { color: var(--cream); font-variant-numeric: tabular-nums; }
.mono { font-family: var(--digits); font-size: 1rem; color: var(--cream); letter-spacing: .03em; }
details summary { cursor: pointer; color: var(--cream); font-size: .8rem; }
details .more { display: grid; gap: 6px; padding-top: 6px; }
details .more p { margin: 0; }
details code { word-break: break-all; font-size: .78rem; color: var(--cream); }

/* action bar */
.actionbar { position: sticky; bottom: 0; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 12px 0 calc(14px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(180deg, transparent, var(--curtain) 32%); }
.quick { display: flex; align-items: center; gap: 4px; font-size: .78rem; color: var(--muted); }
.quick span { margin-right: 4px; }
.quick button { width: 36px; height: 36px; border-radius: 9px; border: 1px solid var(--line); background: var(--shade); font-family: var(--digits); font-weight: 700; font-size: 1.15rem; cursor: pointer; padding: 0; }
.quick button:hover:not(:disabled) { border-color: var(--you); }
.quick button:disabled { opacity: .3; cursor: default; }
.primary { flex: 1 1 150px; min-height: 48px; border: 0; border-radius: 12px; background: var(--brass); color: var(--curtain); font-family: var(--display); font-size: 1.4rem; letter-spacing: .14em; cursor: pointer; }
.primary:disabled { background: var(--brass-soft); color: var(--muted); cursor: not-allowed; }

/* game over */
.over { display: grid; gap: 12px; padding: 16px; border-radius: 16px; background: var(--velvet); border: 1px solid var(--brass-line); margin-bottom: 28px; }
.over h2 { font-family: var(--display); font-weight: 400; font-size: 2.3rem; line-height: 1.1; margin: 0; }
.over h2.win { color: var(--brass); }
.over h2.lose { color: var(--rival); }
.over p { margin: 0; }
.tally { display: flex; gap: 6px; flex-wrap: wrap; }
.acc-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.acc { display: grid; justify-items: start; line-height: 1; }
.acc b { font-family: var(--digits); font-weight: 900; font-size: 2.6rem; color: var(--brass); font-variant-numeric: tabular-nums; }
.acc span { font-size: .74rem; color: var(--muted); margin-top: 2px; }
.bd { display: grid; gap: 6px; }
.bd-title { font-size: .78rem; color: var(--muted); }
.bd-row { display: grid; grid-template-columns: 5.5em minmax(0, 1fr) 3.2em; align-items: center; gap: 8px; font-size: .85rem; }
.bd-row b { font-variant-numeric: tabular-nums; text-align: right; font-weight: 700; }
.bd-track { position: relative; height: 10px; border-radius: 99px; background: var(--shade); }
.bd-track::before { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--line); }
.bd-track i { position: absolute; top: 0; bottom: 0; border-radius: 99px; }
.bd-track i.up { left: 50%; background: var(--you); }
.bd-track i.down { right: 50%; background: var(--rival); }
.keyround { color: var(--cream); }
.spark { width: 100%; height: auto; display: block; }
.spark text { fill: var(--muted); font-family: var(--body); font-size: 10px; }
.habits { margin: 0; padding-left: 1.2em; display: grid; gap: 2px; font-size: .88rem; }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; }
.btnrow .primary { flex: 1 1 140px; font-size: 1.15rem; min-height: 44px; }
.btnrow .ghost { padding: 8px 14px; }
#report-text { width: 100%; min-height: 120px; background: var(--shade); color: var(--cream); border: 1px solid var(--line); border-radius: 10px; padding: 8px; font: inherit; font-size: .82rem; }
.toast { position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--cream); color: var(--curtain); padding: 6px 14px; border-radius: 99px; font-size: .85rem; box-shadow: 0 6px 24px var(--shade); }

/* The Latin display subset uses ASCII; the revealing ellipsis stays in the body face. */
:root[lang="en"] { --display: "TO Digits", Impact, "Arial Narrow", sans-serif; }
:root[lang="en"] .logo, :root[lang="en"] .hero, :root[lang="en"] .sect,
:root[lang="en"] .tier, :root[lang="en"] .lname, :root[lang="en"] .side,
:root[lang="en"] .round, :root[lang="en"] .primary, :root[lang="en"] .lane.out::after,
:root[lang="en"] .over h2 { font-weight: 900; letter-spacing: .02em; }
:root[lang="en"] .logo { font-size: 1.3rem; line-height: 1.1; white-space: nowrap; }
:root[lang="en"] .tag { font-size: .65rem; letter-spacing: .02em; }
:root[lang="en"] .hero { font-size: clamp(3.1rem, 15.5vw, 5.2rem); line-height: .9; text-transform: uppercase; letter-spacing: .03em; }
:root[lang="en"] .star.out::after { font-weight: 900; font-size: 1.05rem; letter-spacing: .06em; }
:root[lang="en"] .sect { font-size: 1.4rem; line-height: 1.15; }
:root[lang="en"] .tier { font-size: 1rem; }
:root[lang="en"] .lname { font-size: 1.7rem; line-height: 1.1; }
:root[lang="en"] .side { font-size: 1.2rem; }
:root[lang="en"] .round { font-size: 1.5rem; line-height: 1.1; }
:root[lang="en"] .primary { font-size: 1.6rem; line-height: 1.1; }

:root[lang="en"] .btnrow .primary { font-size: 1.35rem; }
:root[lang="en"] .lane.out::after { font-size: 1.7rem; line-height: 1.1; padding: 2px 10px; letter-spacing: .08em; }
:root[lang="en"] .over h2 { font-size: 2.5rem; line-height: 1.05; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
@media (max-width: 400px) {

  .rules-c li { padding: 7px 10px; }
}
@media (max-width: 380px) {
  .ava { width: 38px; height: 38px; }

  .top-actions .ghost { padding: 4px 8px; font-size: .75rem; }

  .logo { font-size: 1.3rem; }
  .tag { font-size: .65rem; letter-spacing: .02em; }

  .bar { width: 80px; }

<div class="wrap">

        <span class="ldesc" data-i18n="desc.textbook"></span>
      </button>
      <button class="level" type="button" data-level="reader">
        <span class="tier" data-i18n="tier.reader"></span><span class="lname" data-i18n="level.reader"></span><span class="rec" id="rec-reader"></span>
        <span class="ldesc" data-i18n="reader.desc"></span>

    <h2 class="sect" data-i18n="rules.button"></h2>
    <ol class="rules-c">
      <li data-i18n="rules.1"></li>
      <li data-i18n="rules.2"></li>
      <li data-i18n="rules.3"></li>
      <li data-i18n="rules.4"></li>
    </ol>
  </section>

  <section id="game" hidden>
    <div class="team rival">
      <div class="team-head"><span class="side" data-i18n="team.rival"></span><span id="rival-name"></span><span id="lock" class="lock"></span></div>
      <div id="rival-lanes" class="lanes"></div>
    </div>

    <div class="strip">
      <div class="strip-top">
        <div class="round" id="round-no"></div>
        <div class="meter" data-i18n-title="meter.title">
          <span data-i18n="meter.label"></span><div class="bar"><i id="meter-fill"></i></div><b id="meter-num"></b>
        </div>
      </div>
      <div id="banner" class="banner" aria-live="polite"></div>
      <div id="insight" class="insight"></div>
    </div>

    <div class="team you">
      <div class="team-head"><span class="side" data-i18n="team.you"></span><span data-i18n="team.hint"></span></div>
      <div id="you-lanes" class="lanes"></div>
    </div>

    <div class="actionbar" id="actionbar">
      <div class="quick" id="quick"><span data-i18n="button.all"></span></div>
      <button id="btn-sing" class="primary" type="button" disabled data-i18n="button.sing"></button>
    </div>

    <div id="over" class="over" hidden></div>
  </section>
</div>
<div id="toast" class="toast" hidden></div>

    G.document.head.append(style);
  }
  function openPicker({ lang = "zh", current = null, onPick, onClose } = {}) {

    function onKey(event) {

        else if (!event.shiftKey && (doc.activeElement === last || !dialog.contains(doc.activeElement))) { event.preventDefault(); first.focus(); }

<script>/* Engine + AI for the classic singer-elimination game (3v3, songs 1-5).
   A team is an array of hand bitmasks (bit c-1 set = song c not yet sung), alive singers only.
   Works in the browser (window.SingerAI) and in Node (module.exports). */
(function (G) {
  "use strict";
  const B32 = "0123456789abcdefghijklmnopqrstuv";
  let TABLE = null;
  const setTable = (t) => { TABLE = t; };

  const cardsOf = (m) => { const r = []; for (let c = 1; c <= 5; c++) if (m & (1 << (c - 1))) r.push(c); return r; };
  const teamKey = (masks) => masks.slice().sort((a, b) => a - b).map((m) => B32[m]).join("");
  const stateKey = (mine, theirs) => teamKey(mine) + "|" + teamKey(theirs);
  const actKey = (masks, cards) => masks.map((m, k) => m * 8 + cards[k]).sort((a, b) => a - b).join(",");

  function entry(mine, theirs) {
    const e = TABLE[stateKey(mine, theirs)];
    if (!e) throw new Error("state missing from table: " + stateKey(mine, theirs));
    return e;
  }
  /** P(mine wins) with optimal play from here on. */
  function value(mine, theirs) {
    if (!theirs.length) return 1;
    if (!mine.length) return 0;
    return entry(mine, theirs)[0];
  }

  /** Distinct actions up to swapping singers with identical hands; cards aligned with masks. */
  function actions(masks) {
    const seen = new Map(), lists = masks.map(cardsOf), cur = [];
    (function rec(i) {
      if (i === masks.length) {
        const key = actKey(masks, cur);
        if (!seen.has(key)) seen.set(key, { cards: cur.slice(), key });
        return;
      }
      for (const c of lists[i]) { cur.push(c); rec(i + 1); cur.pop(); }
    })(0);
    return [...seen.values()];
  }

  /** Every way the round can end: [{p, mine, theirs, side, idx}] (side 0 = mine eliminated). */
  function outcomes(mine, theirs, a, b) {
    const low = Math.min(...a, ...b), tied = [];
    a.forEach((c, i) => { if (c === low) tied.push([0, i]); });
    b.forEach((c, j) => { if (c === low) tied.push([1, j]); });
    return tied.map(([side, idx]) => ({
      p: 1 / tied.length, side, idx, low, tiedCount: tied.length,
      mine: mine.map((h, i) => h & ~(1 << (a[i] - 1))).filter((_, i) => !(side === 0 && i === idx)),
      theirs: theirs.map((h, j) => h & ~(1 << (b[j] - 1))).filter((_, j) => !(side === 1 && j === idx)),
    }));
  }
  const payoff = (mine, theirs, a, b) => outcomes(mine, theirs, a, b).reduce((s, o) => s + o.p * value(o.mine, o.theirs), 0);

  /** Resolve a real round: the lowest score goes; a tie is broken uniformly at random. */
  function resolve(mine, theirs, a, b, rng) {
    const outs = outcomes(mine, theirs, a, b);
    const o = outs[Math.floor(rng() * outs.length) % outs.length];
    return { ...o, tied: outs.map((t) => [t.side, t.idx]) };
  }

  /** Optimal mixed strategy for `mine`: [{cards (aligned with mine), p}]. */
  function nash(mine, theirs) {
    const order = mine.map((_, i) => i).sort((i, j) => mine[i] - mine[j]);
    return entry(mine, theirs)[1].map(([cs, p]) => {
      const cards = new Array(mine.length);
      order.forEach((idx, k) => { cards[idx] = +cs[k]; });
      return { cards, p };
    });
  }
  function sample(dist, rng) {
    let r = rng() * dist.reduce((s, d) => s + d.p, 0);
    for (const d of dist) { r -= d.p; if (r <= 0) return d; }
    return dist[dist.length - 1];
  }

  // ---------------- Level 1: 愣头青 — mostly sings its best song, sometimes improvises ----------------
  class Rookie {
    constructor(opts = {}) { this.pMax = opts.pMax ?? 0.45; this.last = null; }
    /** This round's mixed strategy: [{cards, p}] (every AI exposes lastMix after choose). */
    mix(mine) {
      const lists = mine.map(cardsOf), n = lists.reduce((k, l) => k * l.length, 1), out = new Map();
      const add = (cards, p) => { const k = cards.join(","); out.set(k, { cards, p: (out.has(k) ? out.get(k).p : 0) + p }); };
      add(lists.map((l) => l[l.length - 1]), this.pMax);
      (function rec(i, cur) {
        if (i === lists.length) return add(cur.slice(), (1 - this.pMax) / n);
        for (const c of lists[i]) { cur.push(c); rec.call(this, i + 1, cur); cur.pop(); }
      }).call(this, 0, []);
      return [...out.values()];
    }
    choose(mine, theirs, round, rng) {
      this.lastMix = this.mix(mine);
      if (rng() < this.pMax) { this.last = { mode: "best" }; return mine.map((m) => Math.max(...cardsOf(m))); }
      this.last = { mode: "random" };
      return mine.map((m) => { const cs = cardsOf(m); return cs[Math.floor(rng() * cs.length)]; });
    }
    observe() {} newGame() {}
  }

  // ---------------- Level 2: 教科书 — exact Nash equilibrium, cannot be exploited ----------------
  class Textbook {
    constructor() { this.last = null; }
    choose(mine, theirs, round, rng) {
      this.last = { mode: "nash" };
      this.lastMix = nash(mine, theirs);
      return sample(this.lastMix, rng).cards;
    }
    observe() {} newGame() {}
  }

  // ---------------- Level 3: 读心评委 — Nash + learns your habits and punishes them ----------------
  /* Habit feature of a human move: which song (ranked from the top of that singer's remaining songs) the
     team's lowest scorer sang, and whether the team split its scores. Counted per round index, kept across
     games (decayed each new game). Prediction = these counts smoothed toward the human's own Nash mix;
     the AI then best-responds to the prediction, but only with probability that grows with evidence, and
     falls back to Nash when the edge is small. */
  class MindReader {
    constructor(saved, opts = {}) {
      this.counts = (saved && saved.counts) || {};      // counts[round][cls] = weight
      this.games = (saved && saved.games) || 0;
      this.alpha = opts.alpha ?? 2.5;                    // prior strength (pseudo-observations of Nash play)
      this.k = opts.k ?? 3;                              // evidence needed for ~half confidence
      this.lamMax = opts.lamMax ?? 0.9;
      this.minGain = opts.minGain ?? 0.02;
      this.decay = opts.decay ?? 0.8;
      this.last = null;
    }
    static classOf(masks, cards) {
      let mi = 0;
      cards.forEach((c, i) => { if (c < cards[mi]) mi = i; });
      const hand = cardsOf(masks[mi]);
      const rank = hand.length - 1 - hand.indexOf(cards[mi]); // 0 = highest remaining
      return rank + (cards.some((c) => c !== cards[mi]) ? "s" : "");
    }
    predict(hu, ai, round) {
      const acts = actions(hu), n = acts.length, eps = 0.03 / n;
      const nmix = new Map(nash(hu, ai).map((d) => [actKey(hu, d.cards), d.p]));
      const byCls = new Map();
      for (const a of acts) {
        a.w = (nmix.get(a.key) || 0) + eps;
        a.cls = MindReader.classOf(hu, a.cards);
        if (!byCls.has(a.cls)) byCls.set(a.cls, 0);
        byCls.set(a.cls, byCls.get(a.cls) + a.w);
      }
      const W = [...byCls.values()].reduce((s, x) => s + x, 0);
      const cnt = this.counts[round] || {};
      let N = 0; for (const c of byCls.keys()) N += cnt[c] || 0;
      const clsP = new Map();
      for (const [c, w] of byCls) clsP.set(c, ((cnt[c] || 0) + this.alpha * w / W) / (N + this.alpha));
      for (const a of acts) a.p = clsP.get(a.cls) * a.w / byCls.get(a.cls);
      return { acts, clsP, N };
    }
    choose(ai, hu, round, rng) {
      const { acts: hActs, clsP, N } = this.predict(hu, ai, round);
      const aActs = actions(ai), live = hActs.filter((h) => h.p > 1e-4);
      for (const a of aActs) a.ev = live.reduce((s, h) => s + h.p * payoff(ai, hu, a.cards, h.cards), 0);
      const nmix = new Map(nash(ai, hu).map((d) => [actKey(ai, d.cards), d.p]));
      const evNash = aActs.reduce((s, a) => s + (nmix.get(a.key) || 0) * a.ev, 0);
      const best = Math.max(...aActs.map((a) => a.ev)), gain = best - evNash;
      const conf = N / (N + this.k), lam = gain > this.minGain ? this.lamMax * conf : 0;
      const pred = [...clsP.entries()].sort((x, y) => y[1] - x[1]);
      if (rng() < lam) {
        const top = aActs.filter((a) => a.ev >= best - 0.01);
        this.last = { mode: "exploit", pred, gain, lam, conf };
        return top[Math.floor(rng() * top.length) % top.length].cards;
      }
      this.last = { mode: "nash", pred, gain, lam, conf };
      return sample(nash(ai, hu), rng).cards;
    }
    observe(hu, cards, round) {
      const c = MindReader.classOf(hu, cards);
      this.counts[round] = this.counts[round] || {};
      this.counts[round][c] = (this.counts[round][c] || 0) + 1;
    }
    newGame() {
      for (const r in this.counts) for (const c in this.counts[r]) this.counts[r][c] *= this.decay;
      this.games++;
    }
    toJSON() { return { counts: this.counts, games: this.games }; }
  }

  // ---------------- Level 3 v2: 读心评委 — several habit models + safe exploitation ----------------
  /* Each "view" describes a human move by one feature of its lowest song; each expert counts that feature
     in some context (Dirichlet counts smoothed toward the human's own Nash mix). Experts are mixed by their
     past predictive log-likelihood (with forgetting). The AI then deviates from Nash toward the best response
     to the mixed prediction, but only as far as a risk budget allows:
       risk <= gifts (expected value the human already gave away this game) + rho * trust * riskCap,
     where rho grows with the evidence that the model predicts the human better than Nash does (LLR), and
     trust shrinks when deviating has recently done worse than Nash would have (the human is baiting it). */
  const clip2 = (d) => Math.max(-2, Math.min(2, d));
  function lowOf(hu, cards) {
    let mi = 0;
    cards.forEach((c, i) => { if (c < cards[mi]) mi = i; });
    return { mi, low: cards[mi], split: cards.some((c) => c !== cards[mi]) };
  }
  const VIEWS = {
    top: (hu, cards) => { const { mi, low, split } = lowOf(hu, cards), h = cardsOf(hu[mi]);
      return (h.length - 1 - h.indexOf(low)) + (split ? "s" : ""); },          // rank from the top of that hand
    abs: (hu, cards) => { const { low, split } = lowOf(hu, cards); return low + (split ? "s" : ""); },
    vsAI: (hu, cards, c) => { if (c.lastAiLow == null) return null; const { low, split } = lowOf(hu, cards);
      return clip2(low - c.lastAiLow) + (split ? "s" : ""); },                  // vs the AI's last lowest song
    vsSelf: (hu, cards, c) => { if (c.lastHuLow == null) return null; const { low, split } = lowOf(hu, cards);
      return clip2(low - c.lastHuLow) + (split ? "s" : ""); },                  // vs their own last lowest song
  };
  const EXPERTS = [   // [id, view, context]
    ["top_r", "top", (c) => "r" + c.round],
    ["top_g", "top", () => "g"],
    ["abs_g", "abs", () => "g"],
    ["vsAI_o", "vsAI", (c) => c.lastOut || "-"],
    ["vsSelf_o", "vsSelf", (c) => c.lastOut || "-"],
    ["top_lead", "top", (c) => "L" + Math.sign(c.nHu - c.nAi)],
  ];
  const EXPERT_IDS = ["nash", ...EXPERTS.map((e) => e[0])];

  class MindReader2 {
    constructor(saved, opts = {}) {
      const s = saved && saved.v === 2 ? saved : {};
      this.counts = s.counts || {};   // counts[expert][context][class]
      this.logw = s.logw || {};       // expert log-weights
      this.llr = s.llr || 0;          // log-likelihood ratio: mixture vs Nash, with forgetting
      this.dev = s.dev || 0;          // recent profit of deviating vs playing Nash (negative = being punished)
      this.games = s.games || 0;
      this.alpha = opts.alpha ?? 1;
      this.gw = opts.gw ?? 0.9;       // forgetting for expert weights (per observed move)
      this.gl = opts.gl ?? 0.85;      // forgetting for the LLR
      this.decay = opts.decay ?? 0.85;
      this.llrScale = opts.llrScale ?? 1;
      this.riskCap = opts.riskCap ?? 0.35;
      this.gd = opts.gd ?? 0.9;       // forgetting for the deviation profit
      this.trustScale = opts.trustScale ?? 0.1;
      this.useTrust = opts.useTrust ?? 1;
      this.g = {};
      this.last = null;
    }
    predict(hu, ai, ctx) {
      const acts = actions(hu), eps = 0.02 / acts.length;
      const nmix = new Map(nash(hu, ai).map((d) => [actKey(hu, d.cards), d.p]));
      const w = acts.map((a) => (nmix.get(a.key) || 0) + eps), W = w.reduce((s, x) => s + x, 0);
      const pe = { nash: w.map((x) => x / W) }, cls = {}, ctxKey = {};
      for (const [id, view, ctxf] of EXPERTS) {
        const cl = acts.map((a) => VIEWS[view](hu, a.cards, ctx));
        cls[id] = cl;
        if (cl[0] == null) { pe[id] = pe.nash; continue; }
        const ck = ctxKey[id] = ctxf(ctx), Wc = new Map();
        cl.forEach((c, i) => Wc.set(c, (Wc.get(c) || 0) + w[i]));
        const cnt = (this.counts[id] && this.counts[id][ck]) || {};
        let N = 0; for (const c of Wc.keys()) N += cnt[c] || 0;
        pe[id] = cl.map((c, i) => (((cnt[c] || 0) + this.alpha * Wc.get(c) / W) / (N + this.alpha)) * w[i] / Wc.get(c));
      }
      const lw = EXPERT_IDS.map((id) => this.logw[id] || 0), mx = Math.max(...lw);
      const ex = lw.map((x) => Math.exp(x - mx)), Z = ex.reduce((s, x) => s + x, 0);
      const pi = Object.fromEntries(EXPERT_IDS.map((id, k) => [id, ex[k] / Z]));
      const p = acts.map((_, j) => EXPERT_IDS.reduce((s, id) => s + pi[id] * pe[id][j], 0));
      return { acts, pe, cls, ctxKey, p, pi };
    }
    choose(ai, hu, round, rng) {
      const g = this.g;
      if (round === 0) Object.assign(g, { lastAiLow: null, lastHuLow: null, lastOut: null, budget: 0 });
      else g.lastOut = hu.length < g.prevHu ? "hu" : "ai";
      const ctx = { round, lastOut: g.lastOut, lastAiLow: g.lastAiLow, lastHuLow: g.lastHuLow, nHu: hu.length, nAi: ai.length };
      const P = this.predict(hu, ai, ctx), hActs = P.acts, aActs = actions(ai);
      const M = aActs.map((a) => hActs.map((h) => payoff(ai, hu, a.cards, h.cards)));
      const nmix = new Map(nash(ai, hu).map((d) => [actKey(ai, d.cards), d.p]));
      const xN = aActs.map((a) => nmix.get(a.key) || 0);
      const v = value(ai, hu);
      const ev = M.map((row) => row.reduce((s, m, j) => s + m * P.p[j], 0));
      let br = 0;
      ev.forEach((e, i) => { if (e > ev[br] + 1e-12 || (Math.abs(e - ev[br]) <= 1e-12 && xN[i] > xN[br])) br = i; });
      const colN = hActs.map((_, j) => xN.reduce((s, x, i) => s + x * M[i][j], 0));
      const evN = xN.reduce((s, x, i) => s + x * ev[i], 0);
      const rho = 1 - Math.exp(-Math.max(0, this.llr) / this.llrScale);
      const trust = this.useTrust ? Math.exp(Math.min(0, this.dev) / this.trustScale) : 1;
      const R = Math.max(0, g.budget) + rho * trust * this.riskCap;
      let lam = 0, best = evN;
      for (let k = 1; k <= 20; k++) {
        const l = k / 20;
        let worst = Infinity;
        for (let j = 0; j < hActs.length; j++) worst = Math.min(worst, (1 - l) * colN[j] + l * M[br][j]);
        const obj = (1 - l) * evN + l * ev[br];
        if (v - worst <= R + 1e-3 && obj > best + 1e-9) { best = obj; lam = l; }
      }
      const x = xN.map((p, i) => (1 - lam) * p + (i === br ? lam : 0));
      this.lastMix = aActs.map((a, i) => ({ cards: a.cards, p: x[i] })).filter((d) => d.p > 1e-9);
      const pick = sample(x.map((p, i) => ({ p, i })), rng).i, cards = aActs[pick].cards;
      const predMin = {};
      hActs.forEach((h, j) => { const lo = Math.min(...h.cards); predMin[lo] = (predMin[lo] || 0) + P.p[j]; });
      g.pending = { P, M, x, xN, v };
      g.prevHu = hu.length;
      g.lastAiLow = Math.min(...cards);
      this.last = { mode: lam > 0 && pick === br ? "exploit" : "nash", lam, rho, trust, budget: g.budget,
                    predMin: Object.entries(predMin).map(([k, q]) => [+k, q]).sort((a, b) => b[1] - a[1]),
                    gain: ev[br] - evN, weights: P.pi };
      return cards;
    }
    observe(hu, cards) {
      const g = this.g, pd = g.pending;
      if (!pd) return;
      const key = actKey(hu, cards), j = pd.P.acts.findIndex((h) => h.key === key);

    S = null; stable = null;
    showScreen(true);
    renderRecords();
    window.scrollTo(0, 0);
  }

  // ---------- cover: the stage loops one round of the game ----------
  const demo = { run: 0 };
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const CAST = [...RIVAL, ...YOU];
  function buildCast() {
    const star = (id, ref, slot) => {
      const face = Av.render(ref, { size: 44 });
      const ava = slot == null ? `<div class="ava">${face}</div>`
        : `<button type="button" class="ava pick" data-slot="${slot}" aria-label="${attr(t("lineup.change", { name: singerName({ id, ref }) }))}">${face}</button>`;
      return `<div class="star" id="star-${id}" data-out="${attr(t("stamp.out"))}"><div class="card"><span class="q">?</span></div>${ava}</div>`;
    };
    $("#cast").innerHTML = `<div class="crew rival">${RIVAL.map((id, i) => star(id, rivalCover[i])).join("")}</div><div class="vs">VS</div>`
      + `<div class="crew you">${YOU.map((id, i) => star(id, lineup[i], i)).join("")}</div>`;
  }
  function setLineup(next) {
    lineup = next; store.set(KEY_LINEUP, lineup);
    if (lineup.some((r, i) => typeof r === "string" && rivalCover.includes(r))) rivalCover = Av.randomLineup(3, { exclude: presetIds(lineup), rng });
    startDemo();
  }
  function demoScores() {
    const team = () => {
      const base = 2 + Math.floor(rng() * 4), cs = [base, base, base];
      if (rng() < 0.3) cs[Math.floor(rng() * 3)] = Math.max(1, Math.min(5, base + (rng() < 0.5 ? -1 : 1)));
      return cs;
    };
    return [...team(), ...team()];
  }
  function paintDemo(scores, { flip = false, low = [], cursor = null, out = null } = {}) {
    CAST.forEach((id, k) => {
      const el = document.getElementById("star-" + id); if (!el) return;
      el.className = "star" + (low.includes(id) ? " low" : "") + (cursor === id ? " cursor" : "") + (out === id ? " out" : "");
      const card = el.querySelector(".card");
      card.className = "card" + (flip ? " flip" : "");
      card.style.setProperty("--d", k * 110 + "ms");
      card.innerHTML = scores ? `<span>${scores[k]}</span>` : `<span class="q">?</span>`;
    });
  }
  async function demoLoop(run) {
    const live = () => demo.run === run && !$("#menu").hidden;
    while (live()) {
      paintDemo(null); await wait(1100); if (!live()) return;
      const sc = demoScores(); paintDemo(sc, { flip: true }); await wait(1200); if (!live()) return;
      const lo = Math.min(...sc), low = CAST.filter((_, k) => sc[k] === lo), out = low[Math.floor(rng() * low.length)];
      paintDemo(sc, { low }); await wait(500); if (!live()) return;
      if (low.length > 1) {
        const steps = low.length * 2 + low.indexOf(out) + 1;
        for (let k = 0; k < steps; k++) {
          paintDemo(sc, { low, cursor: low[k % low.length] });
          await wait(90 + 220 * (k / steps) ** 2); if (!live()) return;
        }
      }
      paintDemo(sc, { low, out }); await wait(2300);
    }
  }
  function startDemo() {
    buildCast();
    paintDemo([3, 3, 3, 4, 4, 4], { low: ["r0", "r1", "r2"], out: "r1" });   // the first frame already tells the story
    const run = ++demo.run;
    if (!reduceMotion) setTimeout(() => demoLoop(run), 2600);
  }
  function stopDemo() { demo.run++; }

  function newGame(level) {
    ai = LEVELS[level].make();
    ai.newGame();
    if (level === "reader") store.set(KEY_READER, ai.toJSON());
    S = { level, round: 0, phase: "pick", you: mk(YOU, lineup), ai: mk(RIVAL, Av.randomLineup(3, { exclude: presetIds(lineup), rng })),
          pick: {}, aiCards: null, aiInfo: null,
          commit: null, lowIds: [], outId: null, cursorId: null, flip: false, result: null, log: [], winHist: [0.5] };
    showScreen(false);
    startRound();
    window.scrollTo(0, 0);
  }

  async function startRound() {
    const game = S;
    S.pick = {}; S.lowIds = []; S.outId = null; S.cursorId = null; S.flip = false; S.result = { kind: "pick" };
    for (const s of [...S.you, ...S.ai]) s.shown = null;
    const aM = masks(S.ai), yM = masks(S.you);
    S.aiCards = ai.choose(aM, yM, S.round, rng);            // the rival commits before you choose
    S.aiInfo = ai.last ? JSON.parse(JSON.stringify(ai.last)) : null;
    S.aiMix = (ai.lastMix || []).map((d) => ({ cards: d.cards.slice(), p: d.p }));   // its committed strategy, for grading
    const nonce = Math.floor(rng() * 36 ** 6).toString(36).padStart(6, "0");
    S.commit = { text: `R${S.round + 1}|${S.aiCards.join(",")}|${nonce}`, hash: null };
    S.phase = "pick";
    render();
    const round = S.round, h = await sha8(S.commit.text);
    if (S === game && S.round === round && S.commit) { S.commit.hash = h; renderLock(); }
  }

  async function sing() {
    if (!S || S.phase !== "pick") return;
    const game = S, youAlive = alive(S.you), aiAlive = alive(S.ai);
    if (!youAlive.every((s) => S.pick[s.id])) return;
    S.phase = "reveal";
    const yM = youAlive.map((s) => s.mask), aM = aiAlive.map((s) => s.mask);
    const yC = youAlive.map((s) => S.pick[s.id]), aC = S.aiCards;

    const ideal = nash(yM, aM).slice(0, 3).map((d) => ({ cards: d.cards.slice(), p: d.p }));

    let read = null;
    if (S.level === "reader") {
      const guess = S.aiInfo && S.aiInfo.predMin ? S.aiInfo.predMin[0] : null;
      read = { guess, hit: !!(guess && guess[0] === Math.min(...yC)), mode: S.aiInfo ? S.aiInfo.mode : "nash",
               conf: S.aiInfo ? S.aiInfo.rho * S.aiInfo.trust : 0 };
      ai.observe(yM, yC, S.round);
      store.set(KEY_READER, ai.toJSON());
    }

    const o = resolve(aM, yM, aC, yC, rng);                    // side 0 = rival, 1 = you
    const full = analyzeMove(yM, aM, yC, S.aiMix && S.aiMix.length ? S.aiMix : nash(aM, yM), aC, [o.theirs, o.mine]);
    const an = { regret: full.regret, theoryLoss: full.theoryLoss, skill: full.skill, mind: full.mind, luck: full.luck,
                 best: full.bestCards, bestP: full.best };
    const tied = o.tied.map(([side, i]) => (side === 0 ? aiAlive[i] : youAlive[i]));
    const out = o.side === 0 ? aiAlive[o.idx] : youAlive[o.idx];
    aiAlive.forEach((s, i) => { s.shown = aC[i]; s.mask &= ~(1 << (aC[i] - 1)); });
    youAlive.forEach((s, i) => { s.shown = yC[i]; s.mask &= ~(1 << (yC[i] - 1)); });

    S.result = { kind: "reveal", low: o.low, tiedN: tied.length, outId: out.id, mine: S.you.includes(out),
                 an, gradeKey: grade(an), ideal, read, commit: S.commit };
    S.flip = true; render(); S.flip = false;
    await sleep(1050); if (S !== game) return;
    S.lowIds = tied.map((s) => s.id); paintLanes();
    await sleep(450); if (S !== game) return;
    if (tied.length > 1) {
      S.result.kind = "tie"; renderBanner();
      const ids = tied.map((s) => s.id), target = ids.indexOf(out.id), steps = ids.length * 3 + target + 1;
      for (let k = 0; k < steps; k++) {
        document.querySelectorAll(".lane.cursor").forEach((el) => el.classList.remove("cursor"));
        S.cursorId = ids[k % ids.length];
        const el = document.getElementById("lane-" + S.cursorId); if (el) el.classList.add("cursor");
        await sleep(70 + 260 * (k / steps) ** 3); if (S !== game) return;
      }
      await sleep(250); if (S !== game) return;
    }
    out.alive = false; S.outId = out.id; S.cursorId = null; S.result.kind = "done";

    const vAfter = value(masks(S.you), masks(S.ai));
    S.winHist.push(vAfter);
    S.log.push({ round: S.round, you: yC.slice(), ai: aC.slice(), low: o.low, tiedN: tied.length,
                 outId: out.id, mine: S.result.mine, gradeKey: S.result.gradeKey,
                 skill: an.skill, mind: an.mind, luck: an.luck, regret: an.regret });

    if (!alive(S.ai).length || !alive(S.you).length) {
      const won = alive(S.you).length > 0;
      S.phase = "over"; S.won = won;
      bumpRecord(S.level, won);
    } else {
      S.phase = "result";
    }
    render();
    if (S.phase === "over") $("#over").scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "start" });
  }

  function nextRound() { if (S && S.phase === "result") { S.round++; startRound(); } }

  // ---------- rendering ----------
  function lane(s, side) {
    const pick = side === "you" ? S.pick[s.id] : null;
    const canPick = side === "you" && s.alive && S.phase === "pick";
    const name = singerName(s);
    const chips = [1, 2, 3, 4, 5].map((c) => {
      const used = !has(s, c), now = s.shown === c;
      const cls = "chip" + (now ? " now" : used ? " used" : "") + (pick === c && S.phase === "pick" ? " sel" : "");
      if (side === "you") {
        return `<button type="button" class="${cls}" data-id="${s.id}" data-c="${c}" aria-pressed="${pick === c}" aria-label="${attr(t("aria.sing", { name, card: c }))}"${!canPick || used ? " disabled" : ""}>${c}</button>`;
      }
      return `<span class="${cls}" aria-label="${attr(t("aria.card", { name, card: c, used: used && !now ? t("aria.used") : "" }))}">${c}</span>`;
    }).join("");
    let score = "";
    if (s.shown != null) score = `<span>${s.shown}</span>`;
    else if (S.phase === "pick" && s.alive) score = side === "rival" ? `<span class="q">?</span>` : (pick ? `<span class="pend">${pick}</span>` : `<span class="q">·</span>`);
    const classes = ["lane", side];
    if (!s.alive) classes.push("out");
    if (S.outId === s.id) classes.push("justout");
    if (S.lowIds.includes(s.id)) classes.push("low");
    if (S.cursorId === s.id) classes.push("cursor");
    const idx = (side === "rival" ? 0 : 3) + (side === "rival" ? S.ai : S.you).indexOf(s);
    return `<div class="${classes.join(" ")}" id="lane-${s.id}" data-out="${attr(t("stamp.out"))}">
      <div class="who">${avatar(s.ref, 40)}<span class="nm">${name}</span></div>
      <div class="chips">${chips}</div>
      <div class="score${S.flip && s.shown != null ? " flip" : ""}" style="--d:${idx * 110}ms">${score}</div>
    </div>`;
  }

  function paintLanes() {
    $("#rival-lanes").innerHTML = S.ai.map((s) => lane(s, "rival")).join("");
    $("#you-lanes").innerHTML = S.you.map((s) => lane(s, "you")).join("");
  }
  function renderBanner() {
    const r = S.result;
    let html = t(S.round === 0 ? "banner.first" : "banner.next");
    if (r && r.kind === "reveal") html = t("banner.reveal");
    else if (r && r.kind === "tie") html = t("banner.tie", { n: r.tiedN, low: r.low });
    else if (r && r.kind === "done") {
      const why = t(r.tiedN > 1 ? "banner.draw" : "banner.low", { name: who(singer(r.outId)), low: r.low });
      html = `<span class="${r.mine ? "bad" : "good"}"><strong>${t("banner.out", { why })}</strong></span>`;
    }
    $("#banner").innerHTML = html;
  }
  function renderInsight() {
    const r = S.result;
    if (!r || r.kind !== "done") return "";
    const an = r.an;
    const ideal = r.ideal.map((d) => t("insight.move", { move: actLabel(d.cards), p: pct(d.p) })).join(t("insight.separator"));
    const comps = [`${t("comp.skill")} ${pts(an.skill)}`];
    if (Math.abs(an.mind) >= 0.0005) comps.push(`${t("comp.mind")} ${pts(an.mind)}`);
    if (Math.abs(an.luck) >= 0.0005) comps.push(`${t("comp.luck")} ${pts(an.luck)}`);
    const theory = t(an.theoryLoss < 0.0005 ? "insight.noLoss" : "insight.loss", { loss: (an.theoryLoss * 100).toFixed(1) });
    let readTxt = "", readMore = "";
    const read = r.read;
    if (read && read.guess) {
      readTxt = `<span>${t("reader.insight", { low: read.guess[0], p: pct(read.guess[1]),
        hit: t(read.hit ? "reader.hit" : "reader.miss"), mode: read.mode === "exploit" ? t("reader.target") : "" })}</span>`;
      readMore = `<p>${t("reader.more", { mode: t(read.mode === "exploit" ? "reader.exploit" : "reader.nash"), conf: pct(read.conf || 0) })}</p>`;
    }
    return `<div class="row"><span class="grade ${GRADE_CLASSES[r.gradeKey]}">${t(r.gradeKey)}</span><span class="comps">${comps.join(t("insight.separator"))}</span>${readTxt}</div>
      <details><summary>${t("insight.summary")}</summary><div class="more">
        ${an.regret > 0.0005 ? `<p>${t("insight.best", { move: `<strong>${actLabel(an.best)}</strong>`, p: pct(an.bestP) })}</p>` : ""}
        <p>${t("insight.theory", { text: theory })}</p>
        <p>${t("insight.ideal", { moves: `<span class="mono">${ideal}</span>` })}</p>
        ${readMore}
        <p>${t("insight.comps")}</p>
        <p>${t("insight.grades")}</p>
        <p>${t("insight.commit", { text: `<code>${r.commit.text}</code>`, hash: `<code>${r.commit.hash || t("insight.noHash")}</code>` })}</p>
      </div></details>`;
  }
  function renderLock() {
    const L = LEVELS[S.level];
    $("#rival-name").textContent = t("rival.label", { tier: t(L.tierKey), name: t(L.nameKey) });
    $("#lock").textContent = S.phase === "pick" ? (S.commit && S.commit.hash ? t("lock.hash", { hash: S.commit.hash }) : t("lock.ready")) : "";
  }

  function render() {
    paintLanes(); renderBanner(); renderLock();
    $("#round-no").innerHTML = `${t("round.label", { round: S.round + 1 })}<small>${t("round.max")}</small>`;
    const v = S.winHist[S.winHist.length - 1];
    $("#meter-fill").style.width = (v * 100).toFixed(1) + "%";
    $("#meter-num").textContent = pct(v);
    $("#insight").innerHTML = renderInsight();

    const youAlive = alive(S.you);
    const quick = $("#quick");
    quick.hidden = S.phase !== "pick";
    quick.innerHTML = `<span>${t("button.all")}</span>` + [1, 2, 3, 4, 5].map((c) =>
      `<button type="button" data-all="${c}" aria-label="${attr(t("aria.all", { card: c }))}"${S.phase === "pick" && youAlive.every((s) => has(s, c)) ? "" : " disabled"}>${c}</button>`).join("");
    const btn = $("#btn-sing");
    btn.classList.toggle("revealing", S.phase === "reveal");
    $("#actionbar").hidden = S.phase === "over";
    if (S.phase === "pick") { btn.textContent = t("button.sing"); btn.disabled = !youAlive.every((s) => S.pick[s.id]); }
    else if (S.phase === "result") { btn.textContent = t("button.next"); btn.disabled = false; }
    else { btn.textContent = t("button.revealing"); btn.disabled = true; }

    renderOver();
    if (S.phase !== "reveal") stable = JSON.parse(JSON.stringify(S));
  }

  function spark(hist) {
    const W = 320, H = 104, x0 = 36, x1 = W - 12, y = (v) => 10 + (1 - v) * 72;
    const n = hist.length, x = (i) => x0 + (n === 1 ? 0 : (i * (x1 - x0)) / (n - 1));
    const pts = hist.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
    const dots = hist.map((v, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="${i === n - 1 ? 4.5 : 3}" fill="var(--you)"/>`).join("");
    const xl = hist.map((_, i) => `<text x="${x(i).toFixed(1)}" y="${H - 4}" text-anchor="middle">${i === 0 ? t("spark.start") : t("spark.round", { round: i })}</text>`).join("");
    return `<svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="${attr(t("spark.aria"))}">
      <line x1="${x0}" x2="${x1}" y1="${y(0.5)}" y2="${y(0.5)}" stroke="var(--line)" stroke-dasharray="4 4"/>
      <line x1="${x0}" x2="${x1}" y1="${y(1)}" y2="${y(1)}" stroke="var(--line)"/>
      <line x1="${x0}" x2="${x1}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)"/>
      <text x="${x0 - 6}" y="${y(1) + 3}" text-anchor="end">100%</text>
      <text x="${x0 - 6}" y="${y(0.5) + 3}" text-anchor="end">50%</text>
      <text x="${x0 - 6}" y="${y(0) + 3}" text-anchor="end">0%</text>
      <polyline points="${pts}" fill="none" stroke="var(--you)" stroke-width="2.5" stroke-linejoin="round"/>
      ${dots}${xl}</svg>`;
  }

  function rankName(cls, hand) {
    const r = parseInt(cls, 10);
    if (hand === 1) return t("cls.last");
    if (r === (hand || 5) - 1) return t("cls.lowest");
    return t(["cls.highest", "cls.second", "cls.third", "cls.fourth"][r]);
  }
  function habitText(h) {
    const d = parseInt(h.cls, 10), round = h.ctx[0] === "r" ? +h.ctx.slice(1) : null;
    const text = {
      top_r: () => t("habit.top_r", { round: round + 1, name: rankName(h.cls, 5 - round) }),
      top_g: () => t("habit.top_g", { name: rankName(h.cls, 0) }),
      abs_g: () => t("habit.abs_g", { low: d }),
      vsAI_o: () => t("habit.vsAI_o", { after: t("after." + h.ctx), rel: t("rel.ai." + d) }),
      vsSelf_o: () => t("habit.vsSelf_o", { after: t("after." + h.ctx), rel: t("rel.self." + d) }),
      top_lead: () => t("habit.top_lead", { lead: t("lead." + h.ctx), name: rankName(h.cls, 0) }),
    }[h.expert]();
    return text + (h.cls.endsWith("s") ? t("habit.split") : "") + t("habit.share", { p: pct(h.share) });
  }
  function habits() {
    if (S.level !== "reader" || !ai || !ai.habits) return "";
    const seen = new Set();   // one line per distinct habit: "always the top song" shows once, not per context
    const lines = ai.habits(8).filter((h) => h.ctx !== "-" && !seen.has(h.view + h.cls) && seen.add(h.view + h.cls))
      .slice(0, 3).map((h) => `<li>${habitText(h)}</li>`);
    return lines.length ? `<p>${t("reader.habits")}</p><ul class="habits">${lines.join("")}</ul>
      <div class="btnrow"><button type="button" class="ghost" id="btn-forget">${t("reader.forget")}</button></div>` : "";
  }

  function renderOver() {
    const box = $("#over");
    if (S.phase !== "over") { box.hidden = true; return; }
    const L = LEVELS[S.level], rec = (records()[S.level] || { w: 0, l: 0 });
    const counts = Object.fromEntries(Object.keys(GRADE_CLASSES).map((key) => [key, 0]));
    S.log.forEach((e) => { if (counts[e.gradeKey] != null) counts[e.gradeKey]++; });
    const tally = Object.entries(counts).filter(([, n]) => n).map(([k, n]) => `<span class="grade ${GRADE_CLASSES[k]}">${t(k)} ${n}</span>`).join("");
    box.innerHTML = `
      <h2 class="${S.won ? "win" : "lose"}">${t(S.won ? "over.win" : "over.lose")}</h2>
      <p>${t("over.summary", { tier: t(L.tierKey), name: t(L.nameKey), rounds: S.log.length, record: t("records", rec) })}</p>
      <div class="acc-row"><div class="acc"><b>${accuracy()}%</b><span>${t("over.accuracy")}</span></div><div class="tally">${tally}</div></div>
      ${spark(S.winHist)}
      ${breakdown()}
      ${S.won ? "" : `<p class="tip">${t(L.tipKey)}</p>`}
      ${habits()}
      <div class="btnrow">
        <button type="button" class="primary" id="btn-again">${t("button.again")}</button>
        <button type="button" class="ghost" id="btn-copy">${t("button.copy")}</button>
        <button type="button" class="ghost" id="btn-levels">${t("menu.change")}</button>
      </div>
      <textarea id="report-text" readonly hidden aria-label="${attr(t("aria.report"))}"></textarea>`;
    box.hidden = false;
  }

  const sum = (k) => S.log.reduce((a, e) => a + (e[k] || 0), 0);
  function accuracy() {
    const sc = S.log.map((e) => GRADE_SCORE[e.gradeKey]).filter((x) => x != null);
    return sc.length ? Math.round(sc.reduce((a, b) => a + b, 0) / sc.length) : 0;
  }
  function breakdown() {
    if (!S.log.length || S.log[0].skill == null) return "";
    const parts = [["skill", sum("skill")], ["mind", sum("mind")], ["luck", sum("luck")]];
    const scale = Math.max(0.25, ...parts.map(([, x]) => Math.abs(x)));
    const rows = parts.map(([k, x]) => {
      const w = (Math.abs(x) / scale) * 50;
      return `<div class="bd-row"><span>${t("comp." + k)}</span><div class="bd-track"><i class="${x >= 0 ? "up" : "down"}" style="width:${w.toFixed(1)}%"></i></div><b>${pts(x)}</b></div>`;
    }).join("");
    // turning point: the round with the biggest swing, explained by its biggest part
    let key = null;
    for (const e of S.log) {
      const sw = Math.abs(e.skill + e.mind + e.luck);
      if (!key || sw > key.sw) key = { e, sw };
    }
    let keyTxt = "";
    if (key && key.sw >= 0.05) {
      const [k, x] = [["skill", key.e.skill], ["mind", key.e.mind], ["luck", key.e.luck]].sort((a, b) => Math.abs(b[1]) - Math.abs(a[1]))[0];
      keyTxt = `<p class="keyround">${t("over.key", { round: key.e.round + 1, cause: t(`cause.${k}.${x >= 0 ? "up" : "down"}`, { pts: pts(x) }) })}</p>`;
    }
    return `<div class="bd"><p class="bd-title">${t("over.breakdown")}</p>${rows}</div>${keyTxt}`;
  }
  function reportCards(cards) {
    return cards.every((c) => c === cards[0]) ? String(cards[0]) : actCards(cards);
  }
  function report() {
    const L = LEVELS[S.level];
    const lines = [t("report.heading", { tier: t(L.tierKey), name: t(L.nameKey), outcome: t(S.won ? "report.win" : "report.lose") })];
    S.log.forEach((e) => lines.push(t("report.round", { round: e.round + 1, you: reportCards(e.you), ai: reportCards(e.ai), grade: t(e.gradeKey), out: who(singer(e.outId)) })));
    if (S.log.length && S.log[0].skill != null)
      lines.push(t("report.stats", { acc: accuracy() + "%", s: pts(sum("skill")), m: pts(sum("mind")), l: pts(sum("luck")) }));
    lines.push(t("report.history", { history: S.winHist.map(pct).join(t("report.arrow")) }));
    return lines.join("\n");
  }

  function toast(key) {
    const el = $("#toast"); toast.key = key; el.textContent = t(key); el.hidden = false;
    clearTimeout(toast.h); toast.h = setTimeout(() => { el.hidden = true; }, 1800);
  }

  // ---------- events ----------
  document.addEventListener("click", (ev) => {
    const el = ev.target.closest("button"); if (!el) return;
    if (el.dataset.lang) return setLanguage(el.dataset.lang);
    if (el.classList.contains("level")) return newGame(el.dataset.level);
    if (el.id === "btn-shuffle") return setLineup(Av.randomLineup(3, { rng }));
    if (el.dataset.slot != null) {
      const slot = +el.dataset.slot;
      return Av.openPicker({ lang, current: lineup[slot], onPick: (ref) => { const next = lineup.slice(); next[slot] = ref; setLineup(next); } });
    }
    if (el.id === "btn-rules") { const p = $("#rules-panel"); p.hidden = !p.hidden; el.setAttribute("aria-expanded", String(!p.hidden)); return; }
    if (el.id === "btn-menu" || el.id === "btn-levels") return showMenu();
    if (!S) return;
    if (el.dataset.c && S.phase === "pick") { S.pick[el.dataset.id] = +el.dataset.c; return render(); }
    if (el.dataset.all && S.phase === "pick") { for (const s of alive(S.you)) S.pick[s.id] = +el.dataset.all; return render(); }
    if (el.id === "btn-sing") return S.phase === "pick" ? sing() : nextRound();
    if (el.id === "btn-again") return newGame(S.level);
    if (el.id === "btn-forget") { store.del(KEY_READER); ai = new MindReader2(null); toast("reader.forgot"); return renderOver(); }
    if (el.id === "btn-copy") {
      const txt = report();
      const fallback = () => { const ta = $("#report-text"); ta.hidden = false; ta.value = txt; ta.focus(); ta.select(); toast("toast.manual"); };
      try { navigator.clipboard.writeText(txt).then(() => toast("toast.copied"), fallback); } catch (e) { fallback(); }
    }
  });
  document.addEventListener("keydown", (ev) => {
    if (!S || ev.metaKey || ev.ctrlKey || ev.altKey) return;
    if (/^[1-5]$/.test(ev.key) && S.phase === "pick") {
      const c = +ev.key; if (alive(S.you).every((s) => has(s, c))) { for (const s of alive(S.you)) S.pick[s.id] = c; render(); }
    } else if (ev.key === "Enter" && (S.phase === "pick" || S.phase === "result") && document.activeElement.tagName !== "BUTTON") {
      S.phase === "pick" ? sing() : nextRound();
    }
  });

  // ---------- boot (keeps a game in progress across page updates) ----------
  const hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) hot.snapshot(() => ({ S: stable }));
  const boot = (data) => {
    if (data && data.S && data.S.result && data.S.you && data.S.you[0].ref && LEVELS[data.S.level] && data.S.phase !== "reveal") {
      S = data.S; S.cursorId = null; ai = LEVELS[S.level].make();
      showScreen(false);
      render();
    } else showMenu();
  };
  if (hot && hot.ready) hot.ready(boot); else boot((hot && hot.data) || {});
})();
</script>
