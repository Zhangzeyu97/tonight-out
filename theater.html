<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#1f0810">
  <title>翻车剧场</title>
  <link rel="stylesheet" href="fonts/fonts.css">
  <style>
    :root{color-scheme:dark;--curtain:#1f0810;--velvet:#34101a;--brass:#f2c46a;--cream:#fff0db;--muted:#c9a7ae;--you:#72e3cf;--rival:#ff86a8;--low:#ff5b4d;--line:#fff0db26;--display:"TO Display","PingFang SC","Microsoft YaHei",sans-serif;--body:"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
    *{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;color:var(--cream);font:15px/1.4 var(--body);background:radial-gradient(ellipse at 50% 0%,#461724,transparent 65%),var(--curtain)}button,input{font:inherit}button{color:inherit;cursor:pointer}button:disabled{opacity:.5;cursor:wait}:focus-visible{outline:2px solid var(--you);outline-offset:3px}
    .wrap{width:100%;max-width:920px;margin:auto;padding:12px 12px 20px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}h1{font:400 clamp(25px,6.5vw,36px)/1.15 var(--display);letter-spacing:.03em;color:var(--brass);margin:0}.lang-toggle{display:flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:999px;padding:3px;flex-shrink:0;font-size:12px}.lang-toggle button{border:0;background:transparent;color:var(--muted);padding:4px 9px;border-radius:999px}.lang-toggle button[aria-pressed=true]{color:var(--curtain);background:var(--brass)}
    .selector{display:grid;gap:7px;margin-bottom:10px}.maestros{display:flex;gap:8px}.maestro{display:flex;align-items:center;justify-content:center;gap:8px;flex:1;padding:3px 12px;border:1px solid var(--line);background:var(--velvet);border-radius:999px;font-size:14px;min-height:36px}.maestro img{width:25px;height:29px;object-fit:cover;border-radius:50%;border:1px solid var(--brass)}.maestro[aria-pressed=true]{border-color:var(--brass);background:#543022}.choices{display:grid;grid-template-columns:1fr 1fr 1fr;border:1px solid var(--line);border-radius:9px;padding:3px;background:#14040a}.choices button{border:0;background:transparent;border-radius:6px;padding:8px 3px;font-size:12px;line-height:1.1;min-height:34px}.choices button[aria-pressed=true]{background:var(--brass);color:var(--curtain)}
    .stage{position:relative;isolation:isolate;width:100%;aspect-ratio:4/5;max-height:72vh;overflow:hidden;border-radius:12px;border:1px solid #f2c46a66;background:#14040a;box-shadow:0 15px 40px #0005}canvas{position:absolute;inset:0;width:100%;height:100%}.guest-canvas{z-index:3;pointer-events:none}.portrait-rig{position:absolute;left:50%;top:9%;width:34%;min-width:120px;aspect-ratio: .85;transform:translateX(-50%);pointer-events:none;z-index:2}.portrait{position:absolute;inset:0;border-radius:50%;padding:5px;background:linear-gradient(120deg,#7a5219,#ffe09a 25%,#7a5219 48%,#f2c46a 68%,#2b1907);box-shadow:0 0 0 2px #7a5219,0 0 0 4px #f2c46a44,0 8px 16px #0008;transform-origin:50% 85%;will-change:transform}.reaction-mark{position:absolute;left:94%;top:8%;transform:translate(-50%,-50%);z-index:3;color:var(--cream);font:900 28px/1 system-ui;text-shadow:2px 2px 0 #14040a,-2px -2px 0 #14040a;pointer-events:none}.portrait img{display:block;width:100%;height:100%;object-fit:cover;border-radius:50%;border:1px solid #2b1907}
    .caption{position:absolute;left:4%;right:4%;bottom:17%;z-index:5;padding:8px 10px;color:var(--cream);background:#14040af2;border:1px solid #f2c46a66;border-radius:7px;font-size:15px;font-weight:700;line-height:1.3;text-align:center;pointer-events:none}.speech{position:absolute;left:50%;top:94%;width:190px;max-width:60vw;transform:translateX(-50%);padding:7px 10px;border:2px solid #7a5219;border-radius:14px;background:var(--cream);color:#261019;font-size:16px;font-weight:700;line-height:1.25;text-align:center;z-index:5}.speech::before{content:"";position:absolute;top:-9px;left:45%;width:15px;height:15px;transform:rotate(45deg);background:var(--cream);border-left:2px solid #7a5219;border-top:2px solid #7a5219}.speech[data-side=left]::before{left:72%}.speech[data-side=right]::before{left:20%}.speech span{position:relative;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.loop{position:absolute;left:82%;top:24%;transform-origin:left center;white-space:nowrap;background:var(--brass);color:#28100e;border:2px solid #fff0db;border-radius:9px;padding:5px 7px;box-shadow:3px 4px 0 #0006;font-weight:900;font-size:15px;line-height:1.2}.loop small{display:block;font-size:9px;letter-spacing:.1em;margin-bottom:3px}.stamp{position:absolute;z-index:6;left:50%;top:51%;white-space:nowrap;font:900 clamp(28px,8vw,70px)/1.1 var(--display);color:var(--low);border:4px double currentColor;border-radius:7px;background:#14040ae8;padding:10px 12px;box-shadow:0 4px 22px #0006;pointer-events:none}.stamp.bow{color:var(--brass);border:0;background:transparent;text-shadow:0 0 25px var(--brass);font:900 clamp(42px,12vw,85px)/1.1 Georgia,serif}
    .transport{margin-top:8px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--velvet)}.play{width:42px;height:42px;border:0;border-radius:50%;background:var(--brass);color:var(--curtain);font-size:18px;padding:0}.timeline{position:relative;min-width:0}.timeline input{display:block;width:100%;height:25px;margin:0;accent-color:var(--brass);cursor:pointer}.ticks{position:absolute;left:7px;right:7px;top:22px;height:5px;pointer-events:none}.ticks i{position:absolute;width:2px;height:5px;background:var(--muted);border-radius:2px}.ticks i.accident{background:var(--rival)}.ticks i.mistake{background:var(--low)}.time{font:700 12px system-ui;font-variant-numeric:tabular-nums;color:var(--muted);margin-top:5px}.slow{border:1px solid var(--line);border-radius:8px;background:#0005;font-size:13px;padding:8px}.slow[aria-pressed=true]{color:var(--brass);border-color:var(--brass)}.legend{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:10px;margin:8px 0 0}.legend span::before{content:"";display:inline-block;width:7px;height:7px;background:var(--c);border-radius:2px;margin-right:4px}.status{font-size:12px;margin:8px 0;color:var(--brass)}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
    @media(min-width:601px){.wrap{padding-top:18px}.stage{aspect-ratio:16/10}.portrait-rig{width:20%;top:7%;min-width:120px}.speech{font-size:16px}.choices button{font-size:14px}.selector{max-width:620px;margin:0 auto 12px}.loop{font-size:17px}.caption{bottom:17%;left:10%;right:10%}}
    @media(prefers-reduced-motion:reduce){.portrait{will-change:auto}}
  </style>
</head>
<body>
  <main class="wrap">
    <header class="top"><h1 id="title">翻车剧场</h1><div class="lang-toggle" aria-label="Language"><button id="lang-zh" aria-pressed="true">中</button><span>/</span><button id="lang-en" aria-pressed="false">EN</button></div></header>
    <section class="selector" aria-label="选择演出"><div id="maestros" class="maestros"></div><div id="choices" class="choices"></div></section>
    <section id="stage" class="stage" aria-label="演出舞台">
      <span id="now-playing" class="sr-only"></span><span id="ticket" class="sr-only"></span>
      <canvas id="stage-canvas" aria-hidden="true"></canvas>
      <canvas id="guest-canvas" class="guest-canvas" aria-hidden="true"></canvas>
      <div id="portrait-rig" class="portrait-rig">
        <div id="portrait" class="portrait"><img id="portrait-img" src="assets/portraits/beethoven.webp" alt="贝多芬"><span id="reaction-mark" class="reaction-mark" hidden></span></div>
        <div id="loop" class="loop" hidden><small id="loop-label">原地打转</small><span id="loop-text"></span></div>
        <div id="speech" class="speech" hidden><span id="speech-text"></span></div>
      </div>
      <div id="caption" class="caption" hidden><span id="caption-text"></span></div>
      <div id="stamp" class="stamp" hidden></div>
    </section>
    <div class="transport" role="group" aria-label="播放控制">
      <button id="play" class="play" aria-label="播放" disabled>▶</button>
      <div class="timeline"><input id="seek" type="range" min="0" max="24" step="0.001" value="0" aria-label="演出进度"><div id="ticks" class="ticks"></div><div id="time" class="time">0:00 / 0:24</div></div>
      <button id="slow" class="slow" aria-pressed="false">×0.5</button>
    </div>
    <div class="legend"><span id="legend-rh" style="--c:var(--brass)">旋律</span><span id="legend-lh" style="--c:var(--you)">左手 / 准音</span><span id="legend-wrong" style="--c:var(--low)">错音</span><span id="legend-guest" style="--c:var(--rival)">不速之客</span></div>
    <p id="status" class="status" role="status" hidden>正在布置舞台…</p>
    <noscript>请启用 JavaScript 观看演出。Enable JavaScript to view the theater.</noscript>
  </main>
  <script src="theater.js" defer></script>
</body>
</html>
